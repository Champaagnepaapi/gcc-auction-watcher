name: V5 Offline Validation

on:
  pull_request:
    branches:
      - agent/v5-poketrace-cardmarket-market-data
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      POKETRACE_ENABLED: "false"
      PRICECHARTING_ENABLED: "false"
      MARKETPLACE_INSIGHTS_ENABLED: "false"
      GCC_HISTORY_ENABLED: "false"
      CARDGRADER_V5_ALLOW_PAID_CALLS: "false"
      RAW_MAX_PAID_GRADINGS_PER_RUN: "0"

    steps:
      - name: Checkout V5 child branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0

      - name: Assert no commercial/provider secret is injected
        shell: bash
        run: |
          test -z "${POKETRACE_API_KEY:-}"
          test -z "${EBAY_CLIENT_SECRET:-}"
          test -z "${GCC_SESSION_B64:-}"
          echo "commercial/provider secrets injected: 0"

      - name: Run V5 offline tests
        run: python -m unittest discover -s tests_v5 -p 'test*.py'

      - name: Compile V5
        run: python -m compileall -q v5

      - name: Check whitespace/conflict markers
        shell: bash
        run: git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
