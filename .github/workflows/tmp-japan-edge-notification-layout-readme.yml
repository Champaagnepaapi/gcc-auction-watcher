name: Temporary Japan Edge notification README update

on:
  push:
    branches:
      - docs/japan-edge-notification-layout-handoff
    paths:
      - ".github/workflows/tmp-japan-edge-notification-layout-readme.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/japan-edge-notification-layout-handoff
      - name: Append canonical handoff and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          append = '''

---

# Addendum canonique — 16 août 2026 — format comparatif notifications Japan Edge / PR #101

Merge production :

```text
cf652027a767626829d6c3b6d115fb62f64f140c
```

Le contenu économique du Japan Edge n'a pas changé. La notification ntfy affiche désormais les éléments séparément pour lecture immédiate :

```text
Prix Japon: ¥... | rendu estimé ... CHF

GCC exact JP PSA10: €...
→ décote vs GCC: -...%

Marché externe exact: €... | source(s) | n SOLD
→ décote vs externe: -...%

Fair multi-marché: €...
→ décote globale: -...%

VERDICT: ...
ASK, PAS UNE VENTE
```

Si aucun marché externe exact n'est prouvable, la notification indique explicitement `Marché externe exact: non confirmé` et `Fair multi-marché: non confirmé — référence GCC seule`; elle ne fabrique pas de prix mondial.

Validation PR #101 : run `31942800314`, job `95154297972` — tests Japan Edge PASS, compilation PASS, YAML PASS et `git diff --check` PASS.

Aucun changement de discovery, identité, fair value, seuil économique, provider, achat, bid, checkout ou paiement. PR #8 reste expérimentale/non mergée.
'''
          text = path.read_text()
          if "format comparatif notifications Japan Edge / PR #101" not in text:
              path.write_text(text + append)
          PY
          git rm .github/workflows/tmp-japan-edge-notification-layout-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record comparative Japan Edge notification layout"
          git push origin HEAD:docs/japan-edge-notification-layout-handoff
