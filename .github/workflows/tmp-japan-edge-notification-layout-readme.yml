name: Temporary Japan Edge notification README update

on:
  push:
    branches:
      - docs/japan-edge-notification-layout-handoff
    paths:
      - ".github/workflows/tmp-japan-edge-notification-layout-readme.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/japan-edge-notification-layout-handoff
      - name: Append canonical handoff and self-clean
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('README.md'); a=base64.b64decode('').decode(); t=p.read_text(); p.write_text(t if 'format comparatif notifications Japan Edge / PR #101' in t else t+a)"
          git rm .github/workflows/tmp-japan-edge-notification-layout-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record comparative Japan Edge notification layout"
          git push origin HEAD:docs/japan-edge-notification-layout-handoff
