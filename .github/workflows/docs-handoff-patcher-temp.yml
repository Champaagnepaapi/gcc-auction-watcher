name: Docs Handoff Patcher Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data
    paths:
      - .github/workflows/docs-handoff-patcher-temp.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v5-variant-tcgdex-justtcg-handoff
          fetch-depth: 0
      - name: Refresh README canonical handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('### V5 — expérimental, PR #8, NE PAS MERGER')
          end = text.index('### Règles de gouvernance du projet', start)
          replacement = '''### V5 — expérimental, PR #8, NE PAS MERGER

- PR **#8**, branche exacte : `agent/v5-poketrace-cardmarket-market-data`.
- V5 reste un diagnostic **RAW eBay** séparé de la V4 graded GCC.
- Architecture retenue : **TCGdex principal multilingue → PokeTrace Free fallback identité + RAW US market → Pokémon TCG API fallback → arbitres locaux visuel/OCR pour `AMBIGUOUS/INSUFFICIENT`**.
- **JustTCG** a maintenant été benchmarké sur les mêmes samples : il reste une **seconde opinion/fallback expérimental**, pas le resolver principal.
- **Scrydex / Vision** reste réservé aux cas durablement ambigus après épuisement de la chaîne gratuite ; ne pas introduire un coût juste pour forcer le hit-rate.
- Les workflows V5 live/benchmark restent **manuels (`workflow_dispatch`)** après chaque test contrôlé.
- PokeTrace Free : clé dans GitHub Secret `POKETRACE_API_KEY`, **250 req/j**, US + RAW uniquement, cadence affichée et imposée **≥2.25 s**, pas de Cardmarket EU/graded en Free.
- Données listing-level eBay/PokeTrace/JustTCG et images : mémoire-only ; ne pas persister/loguer itemId, titre, URL ou prix individuel.

#### Dernier live PokeTrace de référence — AVANT les nouveaux correctifs

Le dernier PokeTrace Free reste **run `31483091017` / job `93752247632`**, fingerprint `c48b11c284cf453b` :

- eBay search/getItem : **20/20** ; RAW acceptés : 19 ;
- usable identities : **11/20**, ambiguous 4, insufficient 5 ;
- TCGdex : 16 requêtes, **2 hits**, 3 failures ;
- PokeTrace : 12 identities / 30 HTTP / **189 candidats uniques / 0 exact** ;
- matches indépendants : nom 21, set 13, numéro 5 ;
- nom+set 2, nom+numéro 1, set+numéro 3 ;
- **nom+set+numéro : 1**, mais `rejected variant : 1` ;
- visual/OCR rescues : 0 ; market values found : **0** ;
- achats/bids/checkout/CardGrader : 0.

**Important : aucun nouveau run PokeTrace live n'a été effectué depuis les correctifs ci-dessous.** Les améliorations de retrieval/variant sont donc validées offline, mais leur gain live sur le ratio de candidats compatibles reste **à mesurer** ; ne pas prétendre que les 189 candidats sont déjà mieux convertis.

#### Nouveau modèle de variantes PokeTrace/eBay

Le matching ne compare plus une chaîne `variant` brute. Les dimensions sont séparées et canonicalisées :

- finish : `normal/standard`, `holo/holographic/holofoil`, `reverse holo` ;
- edition : `1st Edition`, `Unlimited`, `Shadowless` ;
- promo : preuve par variante/rareté/set lorsqu'elle existe ;
- finishes spéciaux conservateurs : Cosmos/Galaxy/Cracked Ice/Stamped/Poké Ball/Master Ball, etc.

Règles de sécurité : holo ≠ reverse ; 1st Edition/Unlimited/Shadowless contradictoires restent bloquants ; une édition premium manquante n'est jamais inventée ; une finition spéciale non corroborée reste bloquante ; le variant ne remplace jamais nom+set+numéro.

De nouveaux compteurs distinguent `all three + variant compatible`, `all three but variant blocked`, finish/edition/promo matches, metadata missing et conflits détaillés.

#### Retrieval PokeTrace — objectif : beaucoup plus de candidats pertinents sans faux exacts

La récupération est maintenant : recherche textuelle **contextuelle** (`name + set + number`) ; `card_number` structuré lorsqu'il existe ; fallbacks bornés broad-name/broad-number/broad-set ; **jamais** de nom d'affichage envoyé comme `set=` sans slug PokeTrace vérifié ; acceptance locale toujours stricte avec gagnant unique.

Ce patch vise directement le précédent problème (**189 candidats mais très peu compatibles**), mais il faut encore un prochain run Free contrôlé pour mesurer son effet réel.

#### TCGdex — renforcé et toujours principal

- langues réellement supportées ; sinon métadonnées catalogue anglaises sans changer `CardIdentity.language` ;
- résolution de set par nom/`set.id` ;
- formes sûres de `localId` (`004` puis `4`, ou casse alphanumérique) ;
- lookup set/localId puis fallback direct officiel `setId-localId` ;
- dénominateurs complets contradictoires toujours bloquants ;
- `variants.firstEdition/holo/normal/reverse/wPromo` sert seulement à détecter une variante impossible, jamais à inventer celle du listing ;
- failures séparées transport/HTTP/JSON/catalogue set/card lookup.

#### Benchmark final même sample : TCGdex vs JustTCG

Benchmark final **run `31489148268` / job `93771289624`**, fingerprint **`7f440e8cb080097e`**. PokeTrace n'était ni injecté ni instancié.

Échantillon : eBay **20/20**, RAW 20, identité core suffisante 14.

**TCGdex** : exact **5/20**, ambiguous 4, unresolved 11 ; 34 requests, **0 failure** ; canonical changes name/set/number 3/4/1 ; denominator conflicts 2 ; unique/ambiguous set aliases 8/1 ; no-match set/card 2/3 ; localId alternate attempts/hits 5/**3** ; direct-card fallbacks/hits 10/0 ; variant-impossible 1 ; unsupported-language fallback 2.

**JustTCG set-aware** : 2 set-catalog queries, **655 sets** en cache ; mappings uniques/ambigus/no-match 4/3/2 ; 9 card queries ; exact **0/20**, ambiguous 3, unresolved 17 ; failures/429 **0/0** avec cadence Free ≥6.25 s ; 6 candidats reçus, 5 rejetés sur le nom, 1 passe le core puis est rejeté sur la variante.

Comparaison : `both exact=0`, `safe exact consensus=0`, `hard exact disagreement=0`, **TCGdex-only exact=5**, JustTCG-only exact=0. Sur cet échantillon, **TCGdex reste clairement le resolver principal**. JustTCG reste un second avis expérimental et aucun prix JustTCG n'entre dans l'économie V5.

Le benchmark JustTCG charge `/sets` une fois par jeu, résout localement un unique set ID stable, puis filtre `/cards` par `q + set ID + number`. `Retry-After` + un retry est autorisé sur 429 transitoire ; un quota quotidien/mensuel n'est jamais retryé.

#### CI finale après tous les changements

Validation GitHub Actions finale : **run `31489502796` / job `93772388887`**.

- branche V5 derrière `main` : **0** au moment de la validation ;
- fichiers V4 vs `main` : **IDENTIQUES** ;
- V4 : **167/167** ; V5 : **270/270** ;
- `python -m compileall -q v5` : OK ;
- YAML : **11/11** pendant la CI, workflow temporaire inclus puis supprimé ;
- `git diff --check` : OK ;
- appels PokeTrace/JustTCG/eBay live dans la CI : **0/0/0** ; secrets injectés : 0 ;
- achats/bids/checkout/CardGrader : 0.

#### Prochaines actions V5

**Ne pas merger PR #8 pour l'instant.**

1. audit offline indépendant des règles variant + contextual PokeTrace + TCGdex + JustTCG ;
2. ensuite seulement, **un unique prochain PokeTrace Free de 20 listings** pour mesurer le ratio candidats compatibles/exacts ;
3. comparer les compteurs indépendants (`all three`, variant-compatible, raisons de rejet), pas seulement le nombre brut de candidats ;
4. conserver TCGdex principal ; JustTCG second avis ; Scrydex/Vision seulement si l'ambiguïté restante est matérielle ;
5. pas de PokeTrace Pro/Cardmarket avant exacts/valeurs Free réellement exploitables.

La cible `15+/20` reste un objectif si les preuves le permettent, jamais une obligation justifiant des faux positifs.

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          text = path.read_text(encoding='utf-8')
          bottom = text.index('## V5 — expérimental, pas en production')
          replacement_bottom = '''## V5 — expérimental, pas en production

La V5 reste séparée de la V4 et travaille actuellement sur les **listings RAW eBay** et leur identité canonique.

- **TCGdex** reste le resolver catalogue multilingue principal ; dernier benchmark même sample : 5 exacts contre 0 pour JustTCG ;
- **PokeTrace Free** reste fallback identité + RAW US market. Son retrieval contextuel et son modèle de variantes sont validés offline mais **pas encore re-testés en live** ;
- **JustTCG** reste benchmark/seconde opinion set-aware, sans valeur économique acceptée ;
- PR #8 : **draft, ouverte, non mergée** ;
- **Scrydex/Vision** reste dans le radar pour les ambiguïtés persistantes ;
- aucune dépendance payante/PokeTrace Pro/Cardmarket avant preuve Free exploitable.

La règle de sécurité reste la même : **aucun achat, enchère ou checkout automatique**.
'''
          path.write_text(text[:bottom] + replacement_bottom, encoding='utf-8')
          PY
          git diff --check
      - name: Commit README and clean docs staging workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/docs-v5-handoff-temp.yml
          git add -A README.md .github/workflows/docs-v5-handoff-temp.yml
          git commit -m "Docs: refresh canonical V5 handoff after resolver benchmarks"
          git push origin HEAD:docs/v5-variant-tcgdex-justtcg-handoff
