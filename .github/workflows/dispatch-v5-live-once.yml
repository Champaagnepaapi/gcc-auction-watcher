name: Dispatch V5 Live Diagnostic Once

on:
  push:
    branches:
      - ops/v5-live-dispatch-once-20260816-2
    paths:
      - '.github/workflows/dispatch-v5-live-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch final V5 promo-alias diagnostic once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/v5-live-raw-pipeline-diagnostic.yml/dispatches \
            -d '{"ref":"agent/v5-post-macro-applicability-retry"}'
          echo "V5 live diagnostic dispatched once on agent/v5-post-macro-applicability-retry"
          echo "Expected feature head: fadf83f1374aabfc8b2597b4bef68405f4eb1270"
