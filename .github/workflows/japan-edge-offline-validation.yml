name: Japan Edge Offline Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "japan_edge_hunter.py"
      - "japan_edge_hunter_v2.py"
      - "japan_edge_hunter_v3.py"
      - "japan_edge_ppt_shadow.py"
      - "japan_edge_ppt_catalog_shadow.py"
      - "tests_japan/**"
      - ".github/workflows/japan-edge-hunter.yml"
      - ".github/workflows/japan-edge-offline-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'agent/japan-edge-ppt-jp-shadow-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POKEMONPRICETRACKER_API_KEY: ""
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
      NTFY_TOPIC: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert offline safety contract
        shell: bash
        run: |
          test -z "${POKEMONPRICETRACKER_API_KEY:-}"
          test "${JAPAN_EDGE_NOTIFY_ENABLED}" = "false"
          test -z "${NTFY_TOPIC:-}"
          echo "Japan Edge PPT validation: offline, no provider secret, no ntfy"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install PyYAML

      - name: Run Japan Edge unit tests
        run: python -m unittest discover -s tests_japan -p "test*.py" -v

      - name: Compile Japan Edge files
        run: |
          python -m py_compile \
            japan_edge_hunter.py \
            japan_edge_hunter_v2.py \
            japan_edge_hunter_v3.py \
            japan_edge_ppt_shadow.py \
            japan_edge_ppt_catalog_shadow.py \
            tests_japan/test_japan_edge_hunter.py \
            tests_japan/test_japan_edge_hunter_v2.py \
            tests_japan/test_japan_edge_hunter_v3.py \
            tests_japan/test_japan_edge_ppt_shadow.py \
            tests_japan/test_japan_edge_ppt_catalog_shadow.py

      - name: PPT Japanese safety assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('japan_edge_ppt_shadow.py').read_text(encoding='utf-8')
          catalog = Path('japan_edge_ppt_catalog_shadow.py').read_text(encoding='utf-8')
          live = Path('.github/workflows/japan-edge-offline-validation.yml').read_text(encoding='utf-8')
          combined = base + catalog
          assert 'language": "japanese"' in combined
          assert '"setId": set_id' in catalog
          assert 'JP_SET_ID_MAP' in catalog
          assert 'provider_candidates' in catalog
          assert 'SOLD_AGGREGATED' in combined
          assert 'EBAY_GRADED_AGGREGATE' in combined
          assert 'independent_market_increment' in catalog
          assert 'notification_use' in catalog
          assert 'production_decision_use' in catalog
          assert 'workflow_dispatch:' in live
          assert 'ppt-jp-live-shadow:' in live
          assert "github.ref_name == 'agent/japan-edge-ppt-jp-shadow-20260816'" in live
          assert 'JAPAN_EDGE_NOTIFY_ENABLED: "false"' in live
          assert 'NTFY_TOPIC: ""' in live
          assert 'JAPAN_EDGE_PPT_MAX_CANDIDATES: "4"' in live
          assert 'JAPAN_EDGE_PPT_MAX_HTTP_CALLS: "8"' in live
          assert 'JAPAN_EDGE_PPT_MAX_CREDITS: "40"' in live
          assert 'JAPAN_EDGE_PPT_DAILY_REMAINING_FLOOR: "15000"' in live
          print('PPT JP exact-set + visible live-shadow safety assertions: PASS')
          PY

      - name: Parse Japan Edge workflows
        run: python -c 'import pathlib,yaml; [yaml.safe_load(pathlib.Path(p).read_text()) for p in [".github/workflows/japan-edge-hunter.yml", ".github/workflows/japan-edge-offline-validation.yml"]]; print("YAML PASS")'

      - name: Check diff whitespace
        run: |
          base_ref="${{ github.base_ref }}"
          if [ -z "${base_ref}" ]; then base_ref="main"; fi
          git diff --check "origin/${base_ref}...HEAD"

  ppt-jp-live-shadow:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'agent/japan-edge-ppt-jp-shadow-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAPAN_EDGE_GCC_PAGES: "20"
      JAPAN_EDGE_MAX_SEEDS_PER_RUN: "12"
      JAPAN_EDGE_MAX_ITEMS_PER_SEARCH: "25"
      JAPAN_EDGE_MIN_DISCOUNT_PCT: "30"
      JAPAN_EDGE_PROXY_FIXED_JPY: "500"
      JAPAN_EDGE_LOGISTICS_BUFFER_PCT: "12"
      JAPAN_EDGE_GLOBAL_MAX_CANDIDATES: "12"
      V4_POKETRACE_MAX_REQUESTS_PER_RUN: "12"
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      JAPAN_EDGE_PPT_MAX_CANDIDATES: "4"
      JAPAN_EDGE_PPT_MAX_HTTP_CALLS: "8"
      JAPAN_EDGE_PPT_MAX_CREDITS: "40"
      JAPAN_EDGE_PPT_DAILY_REMAINING_FLOOR: "15000"
      JAPAN_EDGE_PPT_INTERVAL_SECONDS: "1.10"
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
      NTFY_TOPIC: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected shadow branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert live-shadow safety contract
        shell: bash
        run: |
          test -n "${POKEMONPRICETRACKER_API_KEY:-}"
          test "${JAPAN_EDGE_NOTIFY_ENABLED}" = "false"
          test -z "${NTFY_TOPIC:-}"
          echo "Japan Edge PPT live shadow: Japanese exact cards, ephemeral state, no ntfy"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Japan Edge V3 read-only baseline
        shell: bash
        run: |
          mkdir -p .japan-edge-ppt-live
          python japan_edge_hunter_v3.py \
            --state .japan-edge-ppt-live/state.json \
            --output japan_edge_ppt_live_baseline.json \
            2>&1 | tee japan_edge_ppt_live_baseline.log

      - name: Enrich exact Japanese leads with PPT exact-set shadow
        shell: bash
        run: |
          python japan_edge_ppt_catalog_shadow.py \
            --input japan_edge_ppt_live_baseline.json \
            --output japan_edge_ppt_live_shadow_report.json \
            2>&1 | tee japan_edge_ppt_live_shadow.log

      - name: Assert PPT stayed correlated and non-economic
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('japan_edge_ppt_live_shadow_report.json').read_text(encoding='utf-8'))
          summary = report.get('ppt_japanese_shadow')
          assert isinstance(summary, dict), 'missing PPT Japanese live summary'
          assert summary.get('language') == 'Japanese'
          assert summary.get('evidence_class') == 'SOLD_AGGREGATED'
          assert summary.get('correlation_group') == 'EBAY_GRADED_AGGREGATE'
          assert summary.get('independent_market_increment') == 0
          assert summary.get('production_decision_use') is False
          assert summary.get('notification_use') is False
          for row in report.get('opportunities', []):
              if not isinstance(row, dict):
                  continue
              shadow = row.get('ppt_japanese_shadow')
              if not isinstance(shadow, dict):
                  continue
              assert shadow.get('language') == 'Japanese'
              assert shadow.get('evidence_class') == 'SOLD_AGGREGATED'
              assert shadow.get('correlation_group') == 'EBAY_GRADED_AGGREGATE'
              assert shadow.get('independent_market_increment') == 0
              assert shadow.get('production_decision_use') is False
              assert shadow.get('notification_use') is False
          baseline_log = Path('japan_edge_ppt_live_baseline.log').read_text(encoding='utf-8', errors='replace')
          shadow_log = Path('japan_edge_ppt_live_shadow.log').read_text(encoding='utf-8', errors='replace')
          assert 'Notification ntfy' not in baseline_log
          assert 'Notification ntfy' not in shadow_log
          print(json.dumps(summary, ensure_ascii=False))
          print('Japan Edge PPT live shadow safety assertions: PASS')
          PY

      - name: Upload Japan Edge PPT live-shadow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-edge-ppt-live-shadow-${{ github.run_id }}
          path: |
            japan_edge_ppt_live_baseline.json
            japan_edge_ppt_live_shadow_report.json
            japan_edge_ppt_live_baseline.log
            japan_edge_ppt_live_shadow.log
          if-no-files-found: error
          retention-days: 14
