name: Japan Edge Offline Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "japan_edge_hunter.py"
      - "tests_japan/**"
      - ".github/workflows/japan-edge-hunter.yml"
      - ".github/workflows/japan-edge-offline-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Japan Edge unit tests
        run: python -m unittest discover -s tests_japan -p "test*.py" -v

      - name: Compile Japan Edge files
        run: python -m py_compile japan_edge_hunter.py tests_japan/test_japan_edge_hunter.py

      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
