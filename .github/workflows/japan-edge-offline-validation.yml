name: Japan Edge Offline Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "japan_edge_hunter.py"
      - "japan_edge_hunter_v2.py"
      - "japan_edge_hunter_v3.py"
      - "japan_edge_ppt_shadow.py"
      - "tests_japan/**"
      - ".github/workflows/japan-edge-hunter.yml"
      - ".github/workflows/japan-edge-offline-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POKEMONPRICETRACKER_API_KEY: ""
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
      NTFY_TOPIC: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert offline safety contract
        shell: bash
        run: |
          test -z "${POKEMONPRICETRACKER_API_KEY:-}"
          test "${JAPAN_EDGE_NOTIFY_ENABLED}" = "false"
          test -z "${NTFY_TOPIC:-}"
          echo "Japan Edge PPT validation: offline, no provider secret, no ntfy"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install PyYAML

      - name: Run Japan Edge unit tests
        run: python -m unittest discover -s tests_japan -p "test*.py" -v

      - name: Compile Japan Edge files
        run: |
          python -m py_compile \
            japan_edge_hunter.py \
            japan_edge_hunter_v2.py \
            japan_edge_hunter_v3.py \
            japan_edge_ppt_shadow.py \
            tests_japan/test_japan_edge_hunter.py \
            tests_japan/test_japan_edge_hunter_v2.py \
            tests_japan/test_japan_edge_hunter_v3.py \
            tests_japan/test_japan_edge_ppt_shadow.py

      - name: PPT Japanese safety assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('japan_edge_ppt_shadow.py').read_text(encoding='utf-8')
          assert 'language": "japanese"' in code
          assert 'SOLD_AGGREGATED' in code
          assert 'EBAY_GRADED_AGGREGATE' in code
          assert 'independent_market_increment' in code
          assert 'notification_use' in code
          assert 'production_decision_use' in code
          print('PPT JP shadow safety assertions: PASS')
          PY

      - name: Parse Japan Edge workflows
        run: python -c 'import pathlib,yaml; [yaml.safe_load(pathlib.Path(p).read_text()) for p in [".github/workflows/japan-edge-hunter.yml", ".github/workflows/japan-edge-offline-validation.yml"]]; print("YAML PASS")'

      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
