name: Japan Edge Offline Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "japan_edge_hunter.py"
      - "japan_edge_hunter_v2.py"
      - "japan_edge_hunter_v3.py"
      - "japan_edge_full_market.py"
      - "japan_edge_ppt_exact_set_shadow.py"
      - "japan_edge_ppt_provider_catalog_fix.py"
      - "tests_japan/**"
      - ".github/workflows/japan-edge-hunter.yml"
      - ".github/workflows/japan-edge-offline-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'agent/japan-edge-ppt-exact-set-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POKEMONPRICETRACKER_API_KEY: ""
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
      NTFY_TOPIC: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert offline safety contract
        shell: bash
        run: |
          test -z "${POKEMONPRICETRACKER_API_KEY:-}"
          test "${JAPAN_EDGE_NOTIFY_ENABLED}" = "false"
          test -z "${NTFY_TOPIC:-}"
          echo "Japan Edge PPT observed-catalog validation: offline, no provider secret, no ntfy"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install PyYAML

      - name: Run Japan Edge unit tests
        run: python -m unittest discover -s tests_japan -p "test*.py" -v

      - name: Compile Japan Edge files
        run: |
          python -m py_compile \
            japan_edge_hunter.py \
            japan_edge_hunter_v2.py \
            japan_edge_hunter_v3.py \
            japan_edge_full_market.py \
            japan_edge_ppt_exact_set_shadow.py \
            japan_edge_ppt_provider_catalog_fix.py \
            tests_japan/test_japan_edge_hunter.py \
            tests_japan/test_japan_edge_hunter_v2.py \
            tests_japan/test_japan_edge_hunter_v3.py \
            tests_japan/test_japan_edge_ppt_exact_set_shadow.py \
            tests_japan/test_japan_edge_ppt_provider_catalog_fix.py

      - name: PPT Japanese observed-catalog safety assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          module = Path('japan_edge_ppt_exact_set_shadow.py').read_text(encoding='utf-8')
          catalog_fix = Path('japan_edge_ppt_provider_catalog_fix.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/japan-edge-offline-validation.yml').read_text(encoding='utf-8')
          assert 'OBSERVED_JP_SET_ID_MAP' in catalog_fix
          assert '("151", 2023): "23599"' in catalog_fix
          assert 'VSTAR Universe remains unmapped' in catalog_fix
          assert 'shadow.JP_SET_ID_MAP = dict(OBSERVED_JP_SET_ID_MAP)' in catalog_fix
          assert 'JP_QUERY_SCOPE_PROVIDER_SET_ID_NUMBER_AND_VARIANT' in catalog_fix
          assert '"setId": set_id' in module
          assert '"language": "japanese"' in module
          assert 'provider_candidates' in module
          assert 'SOLD_AGGREGATED' in module
          assert 'EBAY_GRADED_AGGREGATE' in module
          assert 'independent_market_increment' in module
          assert 'production_decision_use' in module
          assert 'notification_use' in module
          assert 'workflow_dispatch:' in workflow
          assert 'ppt-jp-live-shadow:' in workflow
          assert "github.ref_name == 'agent/japan-edge-ppt-exact-set-20260816'" in workflow
          assert 'python japan_edge_ppt_provider_catalog_fix.py' in workflow
          assert 'JAPAN_EDGE_NOTIFY_ENABLED: "false"' in workflow
          assert 'NTFY_TOPIC: ""' in workflow
          assert 'JAPAN_EDGE_PPT_MAX_CANDIDATES: "4"' in workflow
          assert 'JAPAN_EDGE_PPT_MAX_HTTP_CALLS: "8"' in workflow
          assert 'JAPAN_EDGE_PPT_MAX_CREDITS: "40"' in workflow
          assert 'JAPAN_EDGE_PPT_DAILY_REMAINING_FLOOR: "15000"' in workflow
          print('PPT JP observed-catalog + live-shadow safety assertions: PASS')
          PY

      - name: Parse Japan Edge workflows
        run: python -c 'import pathlib,yaml; [yaml.safe_load(pathlib.Path(p).read_text()) for p in [".github/workflows/japan-edge-hunter.yml", ".github/workflows/japan-edge-offline-validation.yml"]]; print("YAML PASS")'

      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD

  ppt-jp-live-shadow:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'agent/japan-edge-ppt-exact-set-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAPAN_EDGE_GCC_PAGES: "20"
      JAPAN_EDGE_MAX_SEEDS_PER_RUN: "12"
      JAPAN_EDGE_MAX_ITEMS_PER_SEARCH: "25"
      JAPAN_EDGE_MIN_DISCOUNT_PCT: "30"
      JAPAN_EDGE_PROXY_FIXED_JPY: "500"
      JAPAN_EDGE_LOGISTICS_BUFFER_PCT: "12"
      JAPAN_EDGE_GLOBAL_MAX_CANDIDATES: "12"
      V4_POKETRACE_MAX_REQUESTS_PER_RUN: "12"
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      JAPAN_EDGE_PPT_MAX_CANDIDATES: "4"
      JAPAN_EDGE_PPT_MAX_HTTP_CALLS: "8"
      JAPAN_EDGE_PPT_MAX_CREDITS: "40"
      JAPAN_EDGE_PPT_DAILY_REMAINING_FLOOR: "15000"
      JAPAN_EDGE_PPT_INTERVAL_SECONDS: "1.10"
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
      NTFY_TOPIC: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected shadow branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert live-shadow safety contract
        shell: bash
        run: |
          test -n "${POKEMONPRICETRACKER_API_KEY:-}"
          test "${JAPAN_EDGE_NOTIFY_ENABLED}" = "false"
          test -z "${NTFY_TOPIC:-}"
          echo "Japan Edge PPT observed-catalog live shadow: ephemeral state, no ntfy, no production decision use"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Japan Edge V3 read-only baseline
        shell: bash
        run: |
          mkdir -p .japan-edge-ppt-live
          python japan_edge_hunter_v3.py \
            --state .japan-edge-ppt-live/state.json \
            --output japan_edge_ppt_live_baseline.json \
            2>&1 | tee japan_edge_ppt_live_baseline.log

      - name: Enrich exact Japanese leads with observed PPT catalog shadow
        shell: bash
        run: |
          python japan_edge_ppt_provider_catalog_fix.py \
            --input japan_edge_ppt_live_baseline.json \
            --output japan_edge_ppt_live_shadow_report.json \
            2>&1 | tee japan_edge_ppt_live_shadow.log

      - name: Assert PPT stayed correlated and non-economic
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('japan_edge_ppt_live_shadow_report.json').read_text(encoding='utf-8'))
          summary = report.get('ppt_japanese_shadow')
          assert isinstance(summary, dict), 'missing PPT Japanese live summary'
          assert summary.get('language') == 'Japanese'
          assert summary.get('evidence_class') == 'SOLD_AGGREGATED'
          assert summary.get('correlation_group') == 'EBAY_GRADED_AGGREGATE'
          assert summary.get('independent_market_increment') == 0
          assert summary.get('production_decision_use') is False
          assert summary.get('notification_use') is False
          for row in report.get('opportunities', []):
              if not isinstance(row, dict):
                  continue
              shadow = row.get('ppt_japanese_shadow')
              assert isinstance(shadow, dict), 'missing per-row PPT safety payload'
              assert shadow.get('language') == 'Japanese'
              assert shadow.get('evidence_class') == 'SOLD_AGGREGATED'
              assert shadow.get('correlation_group') == 'EBAY_GRADED_AGGREGATE'
              assert shadow.get('independent_market_increment') == 0
              assert shadow.get('production_decision_use') is False
              assert shadow.get('notification_use') is False
          baseline_log = Path('japan_edge_ppt_live_baseline.log').read_text(encoding='utf-8', errors='replace')
          shadow_log = Path('japan_edge_ppt_live_shadow.log').read_text(encoding='utf-8', errors='replace')
          assert 'Notification ntfy' not in baseline_log
          assert 'Notification ntfy' not in shadow_log
          print(json.dumps(summary, ensure_ascii=False))
          print('Japan Edge PPT observed-catalog live shadow safety assertions: PASS')
          PY

      - name: Upload Japan Edge PPT live-shadow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-edge-ppt-observed-catalog-live-shadow-${{ github.run_id }}
          path: |
            japan_edge_ppt_live_baseline.json
            japan_edge_ppt_live_shadow_report.json
            japan_edge_ppt_live_baseline.log
            japan_edge_ppt_live_shadow.log
          if-no-files-found: error
          retention-days: 14
