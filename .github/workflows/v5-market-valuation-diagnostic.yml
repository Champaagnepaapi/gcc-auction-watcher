name: V5 Market Valuation Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-market-valuation-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRICECHARTING_ENABLED: "false"
      MARKETPLACE_INSIGHTS_ENABLED: "false"
      RAW_MAX_PAID_GRADINGS_PER_RUN: "0"
      CARDGRADER_V5_ALLOW_PAID_CALLS: "false"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline aggregate-only V5 market valuation diagnostic
        run: python -m v5.market_diagnostic
