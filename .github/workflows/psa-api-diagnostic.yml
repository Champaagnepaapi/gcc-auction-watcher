name: PSA Public API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-psa-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query official PSA cert and population APIs
        env:
          PSA_API_TOKEN: ${{ secrets.PSA_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          CERT_NUMBER = "118669048"
          CERT_URL = (
              "https://api.psacard.com/publicapi/cert/GetByCertNumber/"
              f"{CERT_NUMBER}"
          )
          POPULATION_URL = (
              "https://api.psacard.com/publicapi/pop/GetPSASpecPopulation/{}"
          )
          RATE_LIMIT_HEADERS = {
              "ratelimit-limit",
              "ratelimit-remaining",
              "ratelimit-reset",
              "retry-after",
              "x-ratelimit-limit",
              "x-ratelimit-remaining",
              "x-ratelimit-reset",
              "x-rate-limit-limit",
              "x-rate-limit-remaining",
              "x-rate-limit-reset",
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(
                  self, request, file_pointer, code, message, headers, new_url
              ):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          token = os.environ.get("PSA_API_TOKEN", "").strip()
          if not token:
              print("HTTP status: not called")
              sys.exit(1)

          def request_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )
              try:
                  with opener.open(request, timeout=20) as response:
                      status = response.status
                      headers = response.headers
                      raw_body = response.read()
              except urllib.error.HTTPError as error:
                  status = error.code
                  headers = error.headers
                  raw_body = error.read()
              except urllib.error.URLError:
                  return 0, {}, None

              try:
                  payload = json.loads(raw_body.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  payload = None
              return status, headers, payload

          def print_rate_limits(prefix, headers):
              for name, value in headers.items():
                  normalized = name.lower()
                  if normalized not in RATE_LIMIT_HEADERS:
                      continue
                  numbers = re.findall(r"\d+(?:\.\d+)?", value)
                  if numbers:
                      print(f"{prefix}{name}: {' '.join(numbers)}")

          cert_status, cert_headers, cert_payload = request_json(CERT_URL)
          print(f"Cert HTTP status: {cert_status}")
          print_rate_limits("Cert ", cert_headers)

          psa_cert = {}
          if isinstance(cert_payload, dict):
              candidate = cert_payload.get("PSACert")
              if isinstance(candidate, dict):
                  psa_cert = candidate

          allowed_fields = (
              "CertNumber",
              "SpecID",
              "Year",
              "Brand",
              "Subject",
              "CardNumber",
              "CardGrade",
              "TotalPopulation",
              "PopulationHigher",
              "ItemStatus",
          )
          for field in allowed_fields:
              value = psa_cert.get(field)
              print(f"{field}: {'' if value is None else value}")

          spec_id = psa_cert.get("SpecID")
          if cert_status != 200 or not isinstance(spec_id, int) or spec_id <= 0:
              sys.exit(1)

          # Documented by PSA Swagger as:
          # GET /publicapi/pop/GetPSASpecPopulation/{specID}
          population_status, population_headers, _ = request_json(
              POPULATION_URL.format(spec_id)
          )
          print(f"Population HTTP status: {population_status}")
          print_rate_limits("Population ", population_headers)
          if population_status != 200:
              sys.exit(1)
          PY
