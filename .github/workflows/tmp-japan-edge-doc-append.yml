name: Temporary Japan Edge README append

on:
  push:
    branches:
      - docs/japan-edge-global-handoff-20260816
    paths:
      - ".github/workflows/tmp-japan-edge-doc-append.yml"

permissions:
  contents: write

jobs:
  append-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/japan-edge-global-handoff-20260816
      - name: Append canonical handoff and self-clean
        run: |
          echo '' | base64 -d >> README.md
          git rm .github/workflows/tmp-japan-edge-doc-append.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record Japan Edge global exact SOLD context"
          git push origin HEAD:docs/japan-edge-global-handoff-20260816
