name: V5 CI Repair Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data
    paths:
      - .github/workflows/v5-ci-repair-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v5-poketrace-cardmarket-market-data
      - name: Apply exact repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Preserve the historical internal helper import surface used by the
          # visual resolver/tests while implementation lives in poketrace_matching.
          replace_exact(
              'v5/poketrace_identity.py',
              '''    CandidateMatchEvidence,\n    _candidate_evidence,\n    _normalize,\n    _normalize_card_name,\n    _normalize_card_number,\n)''',
              '''    CandidateMatchEvidence,\n    _candidate_evidence,\n    _candidate_score_and_rejection,\n    _card_number_parts,\n    _normalize,\n    _normalize_card_name,\n    _normalize_card_number,\n    _partial_card_number_equivalent,\n    _set_similarity,\n    _variant_family,\n)''',
          )
          # Contextual-first remains the primary retrieval strategy, but when a
          # collector number exists it also uses the documented structured number
          # discriminator. Display set names are still never sent as set=.
          replace_exact(
              'v5/poketrace_identity.py',
              'strategies.append(("contextual", " ".join(contextual_parts), False))',
              'strategies.append(("contextual", " ".join(contextual_parts), bool(number)))',
          )

          # JustTCG human-readable set_name is authoritative when present. A
          # contradictory set_name cannot be hidden by a coincidentally similar slug.
          replace_exact(
              'v5/justtcg_identity.py',
              '''            set_score = _set_similarity(identity.set, card.get("set_name"), card.get("set"))\n            if identity.set and set_score < 0.66:''',
              '''            candidate_set_name = card.get("set_name")\n            if _normalize(candidate_set_name):\n                set_score = _set_similarity(identity.set, candidate_set_name, None)\n            else:\n                set_score = _set_similarity(identity.set, None, card.get("set"))\n            if identity.set and set_score < 0.66:''',
          )

          # Tests explicitly lock in the new contextual retrieval contract.
          replace_exact(
              'tests_v5/test_poketrace_identity.py',
              'self.assertEqual(params["search"], "Charizard")',
              'self.assertEqual(params["search"], "Charizard Pokemon TCG Base Set 4/102")',
          )
          replace_exact(
              'tests_v5/test_poketrace_identity.py',
              'self.assertEqual(session.calls[0][1]["params"]["search"], "Base Set")',
              'self.assertEqual(session.calls[0][1]["params"]["search"], "Base Set 4/102")',
          )
          replace_exact(
              'tests_v5/test_post_codex_blockers.py',
              'self.assertEqual(params["search"], "Charizard")',
              'self.assertEqual(params["search"], "Charizard Base Set")',
          )
          PY
      - name: Compile changed modules
        run: python -m compileall -q v5
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5/poketrace_identity.py v5/justtcg_identity.py tests_v5/test_poketrace_identity.py tests_v5/test_post_codex_blockers.py
          git diff --cached --check
          git commit -m "V5: repair contextual resolver regressions"
          git push origin HEAD:agent/v5-poketrace-cardmarket-market-data
