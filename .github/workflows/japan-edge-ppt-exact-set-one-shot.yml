name: Japan Edge PPT Exact Set One Shot

on:
  push:
    branches:
      - agent/japan-edge-ppt-exact-set-20260816
    paths:
      - ".ops/japan-edge-ppt-exact-set-one-shot-20260816.trigger"

permissions:
  contents: read

jobs:
  ppt-jp-live-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAPAN_EDGE_GCC_PAGES: "20"
      JAPAN_EDGE_MAX_SEEDS_PER_RUN: "12"
      JAPAN_EDGE_MAX_ITEMS_PER_SEARCH: "25"
      JAPAN_EDGE_MIN_DISCOUNT_PCT: "30"
      JAPAN_EDGE_PROXY_FIXED_JPY: "500"
      JAPAN_EDGE_LOGISTICS_BUFFER_PCT: "12"
      JAPAN_EDGE_GLOBAL_MAX_CANDIDATES: "12"
      V4_POKETRACE_MAX_REQUESTS_PER_RUN: "12"
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      JAPAN_EDGE_PPT_MAX_CANDIDATES: "4"
      JAPAN_EDGE_PPT_MAX_HTTP_CALLS: "8"
      JAPAN_EDGE_PPT_MAX_CREDITS: "40"
      JAPAN_EDGE_PPT_DAILY_REMAINING_FLOOR: "15000"
      JAPAN_EDGE_PPT_INTERVAL_SECONDS: "1.10"
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
      NTFY_TOPIC: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact shadow SHA without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert one-shot safety contract
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "agent/japan-edge-ppt-exact-set-20260816"
          test -n "${POKEMONPRICETRACKER_API_KEY:-}"
          test "${JAPAN_EDGE_NOTIFY_ENABLED}" = "false"
          test -z "${NTFY_TOPIC:-}"
          echo "Japan Edge PPT one-shot: observed provider setId shadow, ephemeral state, no ntfy"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Japan Edge V3 read-only baseline
        shell: bash
        run: |
          mkdir -p .japan-edge-ppt-live
          python japan_edge_hunter_v3.py \
            --state .japan-edge-ppt-live/state.json \
            --output japan_edge_ppt_live_baseline.json \
            2>&1 | tee japan_edge_ppt_live_baseline.log

      - name: Enrich exact Japanese leads with observed PPT catalog shadow
        shell: bash
        run: |
          python japan_edge_ppt_provider_catalog_fix.py \
            --input japan_edge_ppt_live_baseline.json \
            --output japan_edge_ppt_live_shadow_report.json \
            2>&1 | tee japan_edge_ppt_live_shadow.log

      - name: Assert PPT stayed correlated and non-economic
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('japan_edge_ppt_live_shadow_report.json').read_text(encoding='utf-8'))
          summary = report.get('ppt_japanese_shadow')
          assert isinstance(summary, dict), 'missing PPT Japanese live summary'
          assert summary.get('language') == 'Japanese'
          assert summary.get('evidence_class') == 'SOLD_AGGREGATED'
          assert summary.get('correlation_group') == 'EBAY_GRADED_AGGREGATE'
          assert summary.get('independent_market_increment') == 0
          assert summary.get('production_decision_use') is False
          assert summary.get('notification_use') is False
          for row in report.get('opportunities', []):
              if not isinstance(row, dict):
                  continue
              shadow = row.get('ppt_japanese_shadow')
              assert isinstance(shadow, dict), 'missing per-row PPT safety payload'
              assert shadow.get('language') == 'Japanese'
              assert shadow.get('evidence_class') == 'SOLD_AGGREGATED'
              assert shadow.get('correlation_group') == 'EBAY_GRADED_AGGREGATE'
              assert shadow.get('independent_market_increment') == 0
              assert shadow.get('production_decision_use') is False
              assert shadow.get('notification_use') is False
          baseline_log = Path('japan_edge_ppt_live_baseline.log').read_text(encoding='utf-8', errors='replace')
          shadow_log = Path('japan_edge_ppt_live_shadow.log').read_text(encoding='utf-8', errors='replace')
          assert 'Notification ntfy' not in baseline_log
          assert 'Notification ntfy' not in shadow_log
          print(json.dumps({
              'run_head_sha': '${{ github.sha }}',
              'summary': summary,
          }, ensure_ascii=False))
          print('Japan Edge PPT observed-catalog one-shot safety assertions: PASS')
          PY

      - name: Upload one-shot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-edge-ppt-exact-set-one-shot-${{ github.run_id }}
          path: |
            japan_edge_ppt_live_baseline.json
            japan_edge_ppt_live_shadow_report.json
            japan_edge_ppt_live_baseline.log
            japan_edge_ppt_live_shadow.log
          if-no-files-found: error
          retention-days: 14
