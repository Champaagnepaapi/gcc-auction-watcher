name: Robot KB local PostgreSQL validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mac/robot-kb-local/**"
      - ".github/workflows/robot-kb-cloud-shadow.yml"
      - ".github/workflows/robot-kb-sold-shadow.yml"
      - ".github/workflows/v4-kb-shadow-ingest.yml"
      - "README.md"
      - "docs/project-capability-ledger.md"
      - "docs/project-workflow-inventory.md"
      - "docs/project-branch-inventory.md"
      - "docs/project-open-pr-inventory.md"
      - "docs/project-repository-snapshot.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout validated Robot KB P3 implementation
        uses: actions/checkout@v4
        with:
          ref: 1d06fe33b6fc640657255e15a8d17251aa02b6ce
          path: .robot-kb-p3
          fetch-depth: 1

      - name: Install validation dependencies
        run: |
          python -m pip install -r .robot-kb-p3/requirements-postgres.txt
          python -m pip install PyYAML

      - name: Run proven Robot KB regression suite
        env:
          PYTHONPATH: .robot-kb-p3
        run: python -m unittest discover -s .robot-kb-p3/tests -p "test_robot_kb*.py" -v

      - name: Validate Mac scripts syntax
        run: |
          bash -n "mac/robot-kb-local/robot_kb_local_runner.sh"
          bash -n "mac/robot-kb-local/Installer Robot KB Local.command"
          bash -n "mac/robot-kb-local/Migrer Robot KB Neon vers Mac.command"
          bash -n "mac/robot-kb-local/Etat Robot KB Local.command"

      - name: Assert cloud Neon writers are retired
        run: |
          ! grep -q 'ROBOT_KB_DATABASE_URL.*secrets' .github/workflows/robot-kb-cloud-shadow.yml
          ! grep -q 'ROBOT_KB_DATABASE_URL.*secrets' .github/workflows/robot-kb-sold-shadow.yml
          ! grep -q 'ROBOT_KB_DATABASE_URL.*secrets' .github/workflows/v4-kb-shadow-ingest.yml
          ! grep -q '^  schedule:' .github/workflows/robot-kb-sold-shadow.yml
          ! grep -q '^  workflow_run:' .github/workflows/v4-kb-shadow-ingest.yml

      - name: Parse changed workflows YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for raw in (
              '.github/workflows/robot-kb-cloud-shadow.yml',
              '.github/workflows/robot-kb-sold-shadow.yml',
              '.github/workflows/v4-kb-shadow-ingest.yml',
          ):
              yaml.safe_load(Path(raw).read_text())
              print(f'YAML PASS: {raw}')
          PY

      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
