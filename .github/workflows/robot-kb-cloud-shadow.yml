name: Robot KB cloud shadow

on:
  workflow_dispatch:
    inputs:
      tcgdex_card_1:
        description: "Optional TCGdex LANG:CARD_ID"
        required: false
        type: string
      tcgdex_card_2:
        description: "Optional second TCGdex LANG:CARD_ID"
        required: false
        type: string
      tcgdex_card_3:
        description: "Optional third TCGdex LANG:CARD_ID"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: robot-kb-cloud-shadow
  cancel-in-progress: false

jobs:
  collect-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBOT_KB_DATABASE_URL: ${{ secrets.ROBOT_KB_DATABASE_URL }}
      ROTATION_STATE: v4_kb_fixed_rotation_state.json
      ROTATION_FIXTURE: v4_kb_fixed_batch.json
      ROTATION_MANIFEST: v4_kb_fixed_manifest.json
      TCGDEX_CARD_1: ${{ inputs.tcgdex_card_1 }}
      TCGDEX_CARD_2: ${{ inputs.tcgdex_card_2 }}
      TCGDEX_CARD_3: ${{ inputs.tcgdex_card_3 }}
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Checkout validated P3 shadow candidate
        uses: actions/checkout@v4
        with:
          ref: 1d06fe33b6fc640657255e15a8d17251aa02b6ce
          path: .robot-kb-shadow
          fetch-depth: 1

      - name: Install sidecar dependencies
        working-directory: .robot-kb-shadow
        run: python -m pip install -r requirements-postgres.txt

      - name: Validate database secret presence
        run: |
          if [ -z "$ROBOT_KB_DATABASE_URL" ]; then
            echo "Required repository secret ROBOT_KB_DATABASE_URL is absent." >&2
            exit 1
          fi

      - name: Restore independent fixed rotation cursor state
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ROTATION_STATE }}
          key: v4-kb-rotation-state-${{ github.run_id }}
          restore-keys: |
            v4-kb-rotation-state-

      - name: Fetch 4-page fixed backup rotation batch (GET only)
        run: |
          python v4_kb_fixed_rotation.py rotate \
            --rotation-state "$ROTATION_STATE" \
            --output-fixture "$ROTATION_FIXTURE" \
            --manifest "$ROTATION_MANIFEST" \
            --page-size 100 \
            --pages 4

      - name: Ingest fixed rotation batch + live auction & proven SOLD (GET only)
        run: |
          observed_at=$(python -c 'import json; print(json.load(open("'"$ROTATION_MANIFEST"'"))["retrieved_at"])')
          cd .robot-kb-shadow
          python -m robot_kb.sidecar \
            --allow-live-read-only \
            --gcc-fixture "../$ROTATION_FIXTURE" \
            --live-gcc auction \
            --live-gcc sold \
            --page-size 100 \
            --max-pages 2 \
            --max-records 100 \
            --observed-at "$observed_at"

      - name: Collect optional bounded TCGdex cards (GET only)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.tcgdex_card_1 != '' || inputs.tcgdex_card_2 != '' || inputs.tcgdex_card_3 != '') }}
        run: |
          arguments=()
          if [ -n "$TCGDEX_CARD_1" ]; then arguments+=(--live-tcgdex-card "$TCGDEX_CARD_1"); fi
          if [ -n "$TCGDEX_CARD_2" ]; then arguments+=(--live-tcgdex-card "$TCGDEX_CARD_2"); fi
          if [ -n "$TCGDEX_CARD_3" ]; then arguments+=(--live-tcgdex-card "$TCGDEX_CARD_3"); fi
          cd .robot-kb-shadow
          python -m robot_kb.sidecar --allow-live-read-only "${arguments[@]}"

      - name: Commit rotation cursor state only after successful ingest
        run: |
          python v4_kb_fixed_rotation.py commit \
            --rotation-state "$ROTATION_STATE" \
            --manifest "$ROTATION_MANIFEST"

      - name: Save independent fixed rotation cursor state
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ROTATION_STATE }}
          key: v4-kb-rotation-state-${{ github.run_id }}