name: V5 Post-Codex Blocker Fix

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v5-poketrace-cardmarket-market-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install offline test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0 PyYAML

      - name: Apply exact conservative blocker fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # P0: PokeTrace `set` expects a PokeTrace slug. We currently only carry
          # catalogue display names, so omit the server-side set filter. The shared
          # local matcher still validates the returned candidate set strictly.
          replace_exact(
              "v5/poketrace_identity.py",
              '''            if identity.set:\n                params["set"] = str(identity.set).strip()\n''',
              '''            # Do not send a catalogue display name as PokeTrace `set=`.\n            # That API filter expects a verified PokeTrace set slug; set identity\n            # remains a strict local acceptance discriminator below.\n''',
          )
          replace_exact(
              "v5/market_values/poketrace.py",
              '''        if identity.set:\n            params["set"] = str(identity.set).strip()\n''',
              '''        # `set=` requires a verified PokeTrace slug. Until the identity\n        # model carries one, broaden retrieval and keep strict local set matching.\n''',
          )

          # Avoid two identical calls for name+set identities with no number: once
          # set display names are no longer server filters, only card_number makes
          # the first strategy structurally narrower than the broad fallback.
          replace_exact(
              "v5/poketrace_identity.py",
              '''    if primary_search and (number or set_name):\n        strategies.append(("structured", primary_search, True))\n''',
              '''    if primary_search and number:\n        strategies.append(("structured", primary_search, True))\n''',
          )

          # P0: do not abort the Hybrid chain just because the number is missing.
          replace_exact(
              "v5/card_identity_catalog.py",
              '''    def resolve_identity(self, identity: CardIdentity) -> CatalogIdentityResult:\n        if not identity.card_number:\n            return CatalogIdentityResult(identity)\n        key = self._identity_key(identity)\n''',
              '''    def resolve_identity(self, identity: CardIdentity) -> CatalogIdentityResult:\n        key = self._identity_key(identity)\n''',
          )
          replace_exact(
              "v5/card_identity_catalog.py",
              '''        poketrace = None\n        if self._poketrace_language_allowed(identity):\n            poketrace = self.poketrace_identity.resolve_identity(identity)\n''',
              '''        poketrace = None\n        core_fields = (identity.card_name, identity.set, identity.card_number)\n        if (\n            self._poketrace_language_allowed(identity)\n            and sum(bool(value) for value in core_fields) >= 2\n        ):\n            poketrace = self.poketrace_identity.resolve_identity(identity)\n''',
          )

          # P1: once TCGdex can reconstruct a full printed number, a contradictory
          # complete eBay denominator is evidence of conflict, not permission to
          # silently rewrite the listing identity.
          replace_exact(
              "v5/card_identity_catalog.py",
              '''        if not card_name:\n            return CatalogIdentityResult(identity)\n        resolved = _with_catalog_identity(\n            identity,\n            card_name=card_name,\n            set_name=card_set_name,\n            card_number=_tcgdex_printed_card_number(identity, card),\n            year=release_year,\n        )\n''',
              '''        if not card_name:\n            return CatalogIdentityResult(identity)\n        canonical_card_number = _tcgdex_printed_card_number(identity, card)\n        original_numerator, original_denominator = _card_number_parts(\n            identity.card_number\n        )\n        canonical_numerator, canonical_denominator = _card_number_parts(\n            canonical_card_number\n        )\n        if (\n            original_denominator is not None\n            and canonical_denominator is not None\n            and (\n                original_numerator != canonical_numerator\n                or original_denominator != canonical_denominator\n            )\n        ):\n            self.counters.ambiguous += 1\n            return CatalogIdentityResult(identity, "TCGDEX", False, True)\n        resolved = _with_catalog_identity(\n            identity,\n            card_name=card_name,\n            set_name=card_set_name,\n            card_number=canonical_card_number,\n            year=release_year,\n        )\n''',
          )

          # Existing tests must encode the correct API contract: no unverified
          # display set name is sent as the PokeTrace `set` slug.
          replace_exact(
              "tests_v5/test_poketrace_identity.py",
              '''        self.assertEqual(params["set"], "Pokemon TCG Base Set")\n''',
              '''        self.assertNotIn("set", params)\n''',
          )
          replace_exact(
              "tests_v5/test_poketrace_free.py",
              '''        self.assertEqual(params["set"], "Base Set")\n''',
              '''        self.assertNotIn("set", params)\n''',
          )
          replace_exact(
              "tests_v5/test_poketrace_identity_regressions.py",
              '''        self.assertEqual(params["set"], "Pokemon TCG Base Set")\n''',
              '''        self.assertNotIn("set", params)\n''',
          )
          PY

      - name: Run current V4 tests
        run: python -m unittest discover -s tests -p "test*.py" -v

      - name: Run current V5 tests
        run: python -m unittest discover -s tests_v5 -p "test*.py" -v

      - name: Compile V5
        run: python -m compileall -q v5

      - name: Validate all workflow YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f"YAML OK: {path}")
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5 tests_v5
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Fix post-Codex PokeTrace identity blockers"
          git push origin HEAD:agent/v5-poketrace-cardmarket-market-data
