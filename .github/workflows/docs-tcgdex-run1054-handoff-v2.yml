name: Docs TCGdex run1054 handoff v2

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/docs/v4-tcgdex-run1054-handoff-20260817'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v4-tcgdex-run1054-handoff-20260817
      - name: Patch README
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('## État canonique — 16 août 2026', '## État canonique — 17 août 2026', 1)
          old = 'Dernier merge fonctionnel V4 / Robot KB :\n\n```text\n79eb35232b30e1f02834233937461fe52a506d19\n```'
          new = 'Dernier merge fonctionnel V4 / Robot KB :\n\n```text\nea7cd9e0585c9884397b926d73a7345af4b9e8a1\n```'
          if old not in text:
              raise SystemExit('canonical head anchor not found')
          text = text.replace(old, new, 1)
          header = '### Mise à jour V4 — TCGdex exact-coordinate recovery — 17 août 2026'
          anchor = '### Mise à jour V4 — external coverage drain / FR — 16 août 2026'
          section = '''### Mise à jour V4 — TCGdex exact-coordinate recovery — 17 août 2026

- PR #119 merge `248775d98418d66a0618777ae789ef719460cdf0` : bridge borné et exact pour les 10 `CLEAN_NO_MATCH` revus du run #1037 ; aucune règle fuzzy ni relaxation d'identité.
- PR #120 merge production `ea7cd9e0585c9884397b926d73a7345af4b9e8a1` : récupération déterministe généralisée par alias exact de set/namespace + coordonnée imprimée, avec suffixes d'affichage bornés (`Holo` / `Gold`) uniquement lorsque set + numéro prouvent la carte.
- Validation PR #120, head `34ca7cf0c4c9216daf344a56ebda4cf8f0f0a899`, run `32019647967` : **627/627 tests PASS**, compile PASS, YAML PASS, `git diff --check` PASS, comparaison discovery read-only `87/87`, aucune action économique.
- Vérification production post-merge : run #1054 / `32025266202` sur `ea7cd9e...` — SUCCESS. TCGdex : **10 attempted / 3 exact / 7 CLEAN_NO_MATCH / 0 ambiguous / 0 errors**. PokeTrace : 3 tentatives, uniquement après les 3 identités TCGdex exactes.
- Conclusion : la récupération couvre les patterns prouvés des runs précédents mais **pas encore 100 %** sur de nouveaux listings ; les 7 nouveaux `CLEAN_NO_MATCH` doivent être diagnostiqués séparément. Un `CLEAN_NO_MATCH` reste fail-closed et ne devient jamais une panne TCGdex ni une autorisation de matching approximatif.
- Aucun changement de fair value, `max_recommended`, seuil économique, microvariante, achat, bid, checkout ou paiement.
'''
          if header not in text:
              if anchor not in text:
                  raise SystemExit('README insertion anchor not found')
              text = text.replace(anchor, section + '\n' + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/docs-tcgdex-run1054-handoff-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: record TCGdex recovery production validation'
          git push origin HEAD:docs/v4-tcgdex-run1054-handoff-20260817
