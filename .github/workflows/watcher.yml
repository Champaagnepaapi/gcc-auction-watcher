name: GCC Auction Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scan GCC auctions
        env:
          MAX_PRICE_EUR: "100"
          MIN_DISCOUNT_PCT: "20"
          HEADLESS: "true"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GCC_SESSION_B64: ${{ secrets.GCC_SESSION_B64 }}
        run: |
          echo "$GCC_SESSION_B64" | base64 --decode > gcc_session.json
          python watcher.py
