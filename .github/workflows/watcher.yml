name: GCC Auction Watcher

on:
  # Production cadence is driven externally (Cron-job.org) through
  # workflow_dispatch. Do not add a GitHub schedule here: scheduled Actions
  # proved unreliable for this watcher and would also duplicate external runs.
  # Historical GitHub schedule intentionally removed: cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: gcc-auction-watcher
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-python312-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ensure Chromium runtime is usable
        shell: bash
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Playwright browser cache miss: downloading Chromium once"
            playwright install chromium
          else
            echo "Playwright browser cache hit: Chromium payload restored"
          fi

          set +e
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
          launch_status=$?
          set -e

          if [ "$launch_status" -ne 0 ]; then
            echo "Chromium launch probe failed; installing runner system dependencies"
            playwright install --with-deps chromium
            python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
          fi

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: gcc-state-${{ github.run_id }}
          restore-keys: |
            gcc-state-

      - name: Restore final alerts deduplication state (read-only context)
        uses: actions/cache/restore@v4
        with:
          path: final_alerts.json
          key: gcc-final-alerts-${{ github.run_id }}
          restore-keys: |
            gcc-final-alerts-

      - name: Scan GCC auctions
        id: scan
        env:
          MAX_PRICE_EUR: "100"
          MIN_DISCOUNT_PCT: "30"
          MAX_AUCTION_MINUTES: "60"
          V4_AUCTION_EVALUATION_CAP: "360"
          FIXED_REEVALUATION_TTL_HOURS: "24"

          HEADLESS: "true"

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GCC_SESSION_B64: ${{ secrets.GCC_SESSION_B64 }}
          POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}

          STATE_FILE: state.json

          # Passive historical mirror only; V4 itself never receives Neon credentials.
          V4_KB_SHADOW_SPOOL_PATH: v4_kb_shadow_spool.json
          V4_KB_AUCTION_NEAR_FINAL_MINUTES: "12"

          V4_TCGDEX_ENABLED: "true"
          V4_TCGDEX_REQUEST_TIMEOUT: "6"
          V4_TCGDEX_CACHE_TTL_HOURS: "24"

          V4_POKETRACE_ENABLED: "true"
          V4_POKETRACE_MAX_REQUESTS_PER_RUN: "40"
          V4_POKETRACE_REQUEST_TIMEOUT: "8"
          V4_POKETRACE_PACING_SECONDS: "0.40"
          V4_POKETRACE_MIN_SALES: "3"
          V4_RAW_REVIEW_TTL_HOURS: "24"

          # Mislisted Slab / image OCR notification lane is disabled by V4
          # production policy in run_watcher_multimarket.py. No workflow env can
          # re-enable it, and no Tesseract runtime is installed for this lane.

          # Public eBay SOLD/Completed pages: bounded runtime/anti-bot budgets,
          # not eBay API quotas. Keep auctions at <=4 cards/run while allowing
          # the large fixed EXTERNAL_PENDING backlog to drain at up to 16/run.
          # The eBay run breaker still stops network work after 2 hard timeouts.
          EBAY_ENABLED: "true"
          EBAY_MAX_QUERIES_PER_CARD: "2"
          EBAY_MAX_CARDS_PER_RUN: "16"
          V4_EBAY_FIXED_RESERVE_CARDS_PER_RUN: "12"
          V4_EXTERNAL_PENDING_MAX_PER_RUN: "16"
          V4_EXTERNAL_PENDING_BUDGET_COOLDOWN_MINUTES: "5"
          EBAY_NAV_TIMEOUT: "10000"
          EBAY_PAGE_WAIT_MS: "700"

          PSA_APR_ENABLED: "true"
          PSA_APR_MIN_COMPS: "2"
          PSA_APR_MAX_CARDS_PER_RUN: "2"
          PSA_APR_MAX_RESULTS: "20"
          PSA_APR_NAV_TIMEOUT: "6000"
          PSA_APR_USD_PER_EUR_FALLBACK: ${{ vars.PSA_APR_USD_PER_EUR_FALLBACK }}

        run: |
          started_at=$(date +%s)
          set +e
          printf '%s' "$GCC_SESSION_B64" | base64 --decode > gcc_session.json
          scan_exit_code=$?
          if [ "$scan_exit_code" -eq 0 ]; then
            python run_watcher_multimarket.py
            scan_exit_code=$?
          fi
          set -e
          finished_at=$(date +%s)
          echo "duration_seconds=$((finished_at - started_at))" >> "$GITHUB_OUTPUT"
          echo "exit_code=$scan_exit_code" >> "$GITHUB_OUTPUT"
          exit "$scan_exit_code"

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: gcc-state-${{ github.run_id }}

      - name: Upload passive KB discovery spool
        if: ${{ steps.scan.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v4-kb-shadow-spool
          path: v4_kb_shadow_spool.json
          if-no-files-found: error
          retention-days: 2

      - name: "Register V4 run in issue #1"
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SCAN_STATUS: ${{ steps.scan.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
          SCAN_DURATION_SECONDS: ${{ steps.scan.outputs.duration_seconds }}
          FINAL_OPPORTUNITIES: ${{ steps.scan.outputs.final_opportunities }}
          AUCTION_DISCOVERY_MODE: ${{ steps.scan.outputs.auction_discovery_mode }}
          AUCTION_SCOPE_STATUS: ${{ steps.scan.outputs.auction_scope_status }}
          AUCTION_DISCOVERED_ROWS: ${{ steps.scan.outputs.auction_discovered_rows }}
          AUCTION_TIMER_PARSED: ${{ steps.scan.outputs.auction_timer_parsed }}
          AUCTION_ENDING_SOON: ${{ steps.scan.outputs.auction_ending_soon }}
          AUCTION_FALLBACK_USED: ${{ steps.scan.outputs.auction_fallback_used }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const duration = process.env.SCAN_DURATION_SECONDS || "unavailable";
            const finalOpportunities = process.env.FINAL_OPPORTUNITIES || "unavailable";
            const body = [
              `timestamp_utc=${new Date().toISOString()}`,
              `run_id=${context.runId}`,
              `run_attempt=${process.env.RUN_ATTEMPT}`,
              `trigger=${context.eventName}`,
              `commit_sha=${context.sha}`,
              `scan_status=${process.env.SCAN_STATUS}`,
              `scan_exit_code=${process.env.SCAN_EXIT_CODE || "unavailable"}`,
              `duration_seconds=${duration}`,
              `final_opportunities=${finalOpportunities}`,
              `auction_discovery_mode=${process.env.AUCTION_DISCOVERY_MODE || "unavailable"}`,
              `auction_scope_status=${process.env.AUCTION_SCOPE_STATUS || "unavailable"}`,
              `auction_discovered_rows=${process.env.AUCTION_DISCOVERED_ROWS || "unavailable"}`,
              `auction_timer_parsed=${process.env.AUCTION_TIMER_PARSED || "unavailable"}`,
              `auction_ending_soon=${process.env.AUCTION_ENDING_SOON || "unavailable"}`,
              `auction_fallback_used=${process.env.AUCTION_FALLBACK_USED || "unavailable"}`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });
