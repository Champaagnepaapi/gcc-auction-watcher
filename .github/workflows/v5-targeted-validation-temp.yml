name: V5 Targeted Validation Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data
    paths:
      - .github/workflows/v5-targeted-validation-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0
      - name: Run complete V5 suite
        run: python -m unittest discover -s tests_v5 -p 'test*.py' -v
      - name: Compile V5
        if: always()
        run: python -m compileall -q v5
      - name: Safety assertion
        if: always()
        run: |
          echo 'PokeTrace live calls requested by this workflow: 0'
          echo 'eBay live calls requested by this workflow: 0'
          echo 'Secrets injected by this workflow: 0'
      - name: Publish commit status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'v5-offline-targeted',
              description: `V5 offline suite: ${state}; no live calls`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
