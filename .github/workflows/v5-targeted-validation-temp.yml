name: V5 Targeted Validation Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data
    paths:
      - .github/workflows/v5-targeted-validation-temp.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0
      - name: Run complete V5 suite
        id: tests
        run: python -m unittest discover -s tests_v5 -p 'test*.py' -v
      - name: Compile V5
        id: compile
        if: always()
        run: python -m compileall -q v5
      - name: Safety assertion
        if: always()
        run: |
          echo 'PokeTrace live calls requested by this workflow: 0'
          echo 'eBay live calls requested by this workflow: 0'
          echo 'Secrets injected by this workflow: 0'
      - name: Report result on PR 8
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              '### Intermediate offline V5 validation — variant/TCGdex patch',
              `run_id=${context.runId}`,
              `commit=${context.sha}`,
              `job_status=${{ toJSON(job.status) }}`,
              'PokeTrace_live_calls=0',
              'eBay_live_calls=0',
              'secrets_injected=0',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
              body,
            });
