name: V5 Contract Update Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data
    paths:
      - .github/workflows/v5-contract-update-temp.yml

permissions:
  contents: write

jobs:
  update-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v5-poketrace-cardmarket-market-data
      - name: Update exact test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement count != 1')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'tests_v5/test_poketrace_identity_regressions.py',
              '''    def test_structured_retrieval_replaces_concatenated_primary_search(self):\n        session = _Session([{"data": [_candidate()]}])\n        resolver = PokeTraceIdentityResolver(_provider(session))\n\n        result = resolver.resolve_identity(_identity())\n\n        self.assertTrue(result.matched)\n        params = session.calls[0][1]["params"]\n        self.assertEqual(params["search"], "Charizard")\n        self.assertEqual(params["card_number"], "4/102")\n        self.assertNotIn("set", params)\n        self.assertEqual(resolver.counters.structured_searches, 1)''',
              '''    def test_contextual_retrieval_combines_clues_without_unverified_set_filter(self):\n        session = _Session([{"data": [_candidate()]}])\n        resolver = PokeTraceIdentityResolver(_provider(session))\n\n        result = resolver.resolve_identity(_identity())\n\n        self.assertTrue(result.matched)\n        params = session.calls[0][1]["params"]\n        self.assertEqual(params["search"], "Charizard Pokemon TCG Base Set 4/102")\n        self.assertEqual(params["card_number"], "4/102")\n        self.assertNotIn("set", params)\n        self.assertEqual(resolver.counters.contextual_searches, 1)''',
          )
          replace_exact(
              'tests_v5/test_live_raw_pipeline.py',
              '''self.assertIn('POKETRACE_MIN_REQUEST_INTERVAL_SECONDS: "2.05"', workflow)''',
              '''self.assertIn('POKETRACE_MIN_REQUEST_INTERVAL_SECONDS: "2.25"', workflow)''',
          )
          PY
          git diff --check
      - name: Commit test-contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests_v5/test_poketrace_identity_regressions.py tests_v5/test_live_raw_pipeline.py
          git commit -m "V5: update contextual retrieval test contracts"
          git push origin HEAD:agent/v5-poketrace-cardmarket-market-data
