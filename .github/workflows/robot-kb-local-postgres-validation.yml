name: Robot KB local PostgreSQL validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mac/robot-kb-local/**"
      - "tests/test_robot_kb_local_mac_migration.py"
      - "tests/test_robot_kb_local_viewer.py"
      - "tests/test_robot_kb_multisource_harvest.py"
      - "tests/test_robot_kb_paid_provider_fairness.py"
      - "tests/test_robot_kb_provider_persistence_bounds.py"
      - "tests/test_robot_kb_ebay_rapidapi_shadow.py"
      - "tests/test_robot_kb_ebay_exact_benchmark.py"
      - "tests/test_robot_kb_ebay_corroborated_import.py"
      - "tests/test_robot_kb_tcgdex_canonicalize.py"
      - "tests/test_robot_kb_ebay_corroborated_batch.py"
      - "tests/test_robot_kb_psa_corroboration_harvest.py"
      - "tests/test_robot_kb_fanatics_sales_history_probe.py"
      - "tests/test_robot_kb_fanatics_paid_sold_harvest.py"
      - "tests/test_robot_kb_fanatics_paid_pending_capture.py"
      - ".github/workflows/robot-kb-cloud-shadow.yml"
      - ".github/workflows/robot-kb-sold-shadow.yml"
      - ".github/workflows/v4-kb-shadow-ingest.yml"
      - ".github/workflows/robot-kb-local-postgres-validation.yml"
      - "README.md"
      - "docs/project-current-phase.md"
      - "docs/project-capability-ledger.md"
      - "docs/project-workflow-inventory.md"
      - "docs/project-branch-inventory.md"
      - "docs/project-open-pr-inventory.md"
      - "docs/project-repository-snapshot.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout validated Robot KB P3 implementation
        uses: actions/checkout@v4
        with:
          ref: 1d06fe33b6fc640657255e15a8d17251aa02b6ce
          path: .robot-kb-p3
          fetch-depth: 1

      - name: Install validation dependencies
        run: |
          python -m pip install -r .robot-kb-p3/requirements-postgres.txt
          python -m pip install -r requirements.txt
          python -m pip install PyYAML

      - name: Run proven Robot KB regression suite
        env:
          PYTHONPATH: .robot-kb-p3
        run: python -m unittest discover -s .robot-kb-p3/tests -p "test_robot_kb*.py" -v

      - name: Run local Mac migration contract tests
        run: python -m unittest discover -s tests -p "test_robot_kb_local_mac_migration.py" -v

      - name: Run local read-only viewer contract tests
        run: python -m unittest discover -s tests -p "test_robot_kb_local_viewer.py" -v

      - name: Run local multisource harvest contract tests
        env:
          PYTHONPATH: .robot-kb-p3:.
        run: |
          python -m unittest discover -s tests -p "test_robot_kb_multisource_harvest.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_paid_provider_fairness.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_provider_persistence_bounds.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_ebay_rapidapi_shadow.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_ebay_exact_benchmark.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_ebay_corroborated_import.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_tcgdex_canonicalize.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_ebay_corroborated_batch.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_psa_corroboration_harvest.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_fanatics_sales_history_probe.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_fanatics_paid_sold_harvest.py" -v
          python -m unittest discover -s tests -p "test_robot_kb_fanatics_paid_pending_capture.py" -v

      - name: Validate Mac scripts syntax
        run: |
          bash -n "mac/robot-kb-local/robot_kb_local_runner.sh"
          bash -n "mac/robot-kb-local/Installer Robot KB Local.command"
          bash -n "mac/robot-kb-local/Configurer APIs Robot KB.command"
          bash -n "mac/robot-kb-local/Migrer Robot KB Neon vers Mac.command"
          bash -n "mac/robot-kb-local/Etat Robot KB Local.command"
          bash -n "mac/robot-kb-local/Ouvrir Robot KB.command"
          python -m py_compile "mac/robot-kb-local/robot_kb_viewer.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_multisource_harvest.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_multisource_p3_compat.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_multisource_provider_bounds.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_multisource_paid_fairness.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_multisource_entrypoint.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_ebay_rapidapi_shadow.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_ebay_exact_benchmark.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_ebay_corroborated_import.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_tcgdex_canonicalize.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_ebay_corroborated_batch.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_psa_corroboration_harvest.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_fanatics_sales_history_probe.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_fanatics_paid_sold_harvest.py"
          python -m py_compile "mac/robot-kb-local/robot_kb_fanatics_paid_pending_capture.py"

      - name: Assert automatic Neon writers are retired after verified cutover
        run: |
          grep -q 'ROBOT_KB_DATABASE_URL:' .github/workflows/robot-kb-cloud-shadow.yml
          grep -q 'ROBOT_KB_DATABASE_URL:' .github/workflows/robot-kb-sold-shadow.yml
          grep -q 'ROBOT_KB_DATABASE_URL:' .github/workflows/v4-kb-shadow-ingest.yml
          grep -q '^  workflow_dispatch:' .github/workflows/robot-kb-cloud-shadow.yml
          grep -q '^  workflow_dispatch:' .github/workflows/robot-kb-sold-shadow.yml
          grep -q '^  workflow_dispatch:' .github/workflows/v4-kb-shadow-ingest.yml
          ! grep -q '^  schedule:' .github/workflows/robot-kb-cloud-shadow.yml
          ! grep -q '^  schedule:' .github/workflows/robot-kb-sold-shadow.yml
          ! grep -q '^  workflow_run:' .github/workflows/v4-kb-shadow-ingest.yml
          grep -q 'source_run_id:' .github/workflows/v4-kb-shadow-ingest.yml
          grep -Fq 'run-id: ${{ inputs.source_run_id }}' .github/workflows/v4-kb-shadow-ingest.yml

      - name: Parse workflows YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for raw in (
              '.github/workflows/robot-kb-cloud-shadow.yml',
              '.github/workflows/robot-kb-sold-shadow.yml',
              '.github/workflows/v4-kb-shadow-ingest.yml',
              '.github/workflows/robot-kb-local-postgres-validation.yml',
          ):
              yaml.safe_load(Path(raw).read_text())
              print(f'YAML PASS: {raw}')
          PY

      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
