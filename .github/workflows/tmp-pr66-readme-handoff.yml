name: Temporary PR66 README handoff

on:
  push:
    branches:
      - agent/v4-unresolved-slab-manual-review
    paths:
      - .github/workflows/tmp-pr66-readme-handoff.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-unresolved-slab-manual-review
          fetch-depth: 0

      - name: Append canonical PR66 handoff and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^# PR #66 — Manual slab review sur cert + OCR non résolus$' README.md; then
            echo '' | base64 -d >> README.md
          fi
          rm -f .github/workflows/tmp-pr66-readme-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/tmp-pr66-readme-handoff.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record PR66 manual slab review handoff"
          git push origin HEAD:agent/v4-unresolved-slab-manual-review
