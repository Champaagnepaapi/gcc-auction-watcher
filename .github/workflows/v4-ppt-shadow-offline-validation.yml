name: V4 PPT Shadow Offline Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "v4_ppt_shadow_model.py"
      - "v4_ppt_shadow_provider.py"
      - "v4_ppt_shadow_language_bridge.py"
      - "run_watcher_multimarket.py"
      - "tests/test_v4_ppt_shadow*.py"
      - ".github/workflows/v4-ppt-shadow-offline-validation.yml"
      - ".github/workflows/v4-auction-discovery-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'agent/v4-ppt-shadow-market-20260815') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/v4-ppt-shadow-market-20260815')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V4_PPT_SHADOW_ENABLED: "false"
      POKEMONPRICETRACKER_API_KEY: ""
      NTFY_TOPIC: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout PR merge result without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert offline contract
        shell: bash
        run: |
          test -z "${POKEMONPRICETRACKER_API_KEY:-}"
          test -z "${NTFY_TOPIC:-}"
          test "${V4_PPT_SHADOW_ENABLED}" = "false"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PPT/network secrets injected: 0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run complete V4 unit suite offline
        run: python -m unittest discover -s tests -p "test*.py" -v

      - name: Compile PPT shadow and V4 entrypoint
        run: |
          python -m py_compile \
            v4_ppt_shadow_model.py \
            v4_ppt_shadow_provider.py \
            v4_ppt_shadow_language_bridge.py \
            run_watcher_multimarket.py \
            tests/test_v4_ppt_shadow.py \
            tests/test_v4_ppt_shadow_language_gate.py \
            tests/test_v4_ppt_shadow_install.py \
            tests/test_v4_ppt_shadow_cross_language.py

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Safety assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          provider = Path('v4_ppt_shadow_provider.py').read_text(encoding='utf-8')
          bridge = Path('v4_ppt_shadow_language_bridge.py').read_text(encoding='utf-8')
          model = Path('v4_ppt_shadow_model.py').read_text(encoding='utf-8')
          assert 'SOLD_AGGREGATED' in provider or 'SOLD_AGGREGATED' in model
          assert 'SOLD_ITEM_LEVEL' not in provider
          assert 'SOLD_ITEM_LEVEL' not in bridge
          assert 'CROSS_LANGUAGE_EN_ANCHOR' in bridge
          assert 'same-card + same-grader + same-grade' in bridge
          assert 'V4_PPT_SHADOW_ENABLED' in provider or 'V4_PPT_SHADOW_ENABLED' in bridge
          assert 'production_economic_use' in bridge
          assert 'notification_use' in bridge
          assert 'EXTERNAL_RESCUE' in bridge
          print('PPT cross-language shadow safety assertions: PASS')
          PY