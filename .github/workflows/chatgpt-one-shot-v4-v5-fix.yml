name: ChatGPT one-shot V4 V5 fix

on:
  push:
    branches:
      - chatgpt-v4-v5-live-fix-20260810
    paths:
      - .github/workflows/chatgpt-one-shot-v4-v5-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-v4-v5-live-fix-20260810
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0

      - name: Apply exact maintenance patch
        run: python .github/scripts/chatgpt_apply_v4_v5_fix.py

      - name: Run V4 tests
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Run V5 tests
        run: python -m unittest discover -s tests_v5 -p 'test*.py'

      - name: Compile changed Python
        run: python -m py_compile watcher.py gcc_history_shared.py v5/gcc_live_adapter.py v5/live_raw_pipeline.py tests/test_v4_grader_preservation.py tests_v5/test_gcc_live_adapter_matching.py

      - name: Validate diff
        run: git diff --check

      - name: Commit tested patch to maintenance branch
        run: |
          git config user.name "chatgpt-maintenance[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watcher.py gcc_history_shared.py v5/gcc_live_adapter.py v5/live_raw_pipeline.py tests_v5/test_gcc_live_adapter.py tests/test_v4_grader_preservation.py tests_v5/test_gcc_live_adapter_matching.py
          git commit -m "fix: preserve GCC grading and widen V5 live matching"
          git push origin HEAD:chatgpt-v4-v5-live-fix-20260810
