name: Robot KB One-shot Migration Test Update

on:
  push:
    branches:
      - agent/kb-tcgdex-macro-cache
    paths:
      - 'scripts/patch_kb_migration_test_expectations.py'

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kb-tcgdex-macro-cache
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact migration-version expectation updates
        run: python scripts/patch_kb_migration_test_expectations.py

      - name: Commit only the expected test updates and remove one-shot tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_kb_migration_test_expectations.py
          git rm .github/workflows/kb-one-shot-migration-test-update.yml
          git add tests/test_robot_kb_final_remediation.py \
                  tests/test_robot_kb_foundation.py \
                  tests/test_robot_kb_integrity_hardening.py \
                  tests/test_robot_kb_sidecar_remediation.py \
                  tests/test_robot_kb_postgres.py
          git diff --cached --check
          git commit -m "test(kb): advance migration version expectations"
          git push origin HEAD:agent/kb-tcgdex-macro-cache
