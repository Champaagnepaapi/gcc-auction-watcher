name: V5 Catalog Uniqueness Offline CI Temp

on:
  push:
    branches:
      - agent/v5-deterministic-catalog-uniqueness

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0 PyYAML==6.0.2
      - name: Run V5 offline suite
        run: python -m unittest discover -s tests_v5 -p "test*.py" -v
      - name: Run V4 regression suite
        run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Compile V5
        run: python -m compileall -q v5
      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml'))
          for path in paths:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print(f"YAML OK: {len(paths)}")
          PY
      - name: Diff check against V5 base
        run: git diff --check origin/agent/v5-poketrace-cardmarket-market-data...HEAD
