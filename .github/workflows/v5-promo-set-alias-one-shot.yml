name: V5 Promo Set Alias One-shot

on:
  push:
    branches:
      - agent/v5-post-macro-applicability-retry
    paths:
      - 'scripts/patch_v5_promo_set_alias.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v5-post-macro-applicability-retry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact bounded patch
        run: python scripts/patch_v5_promo_set_alias.py
      - name: Commit target code and remove one-shot tooling
        shell: bash
        run: |
          test "$(git diff --name-only)" = "v5/card_identity_catalog.py"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_v5_promo_set_alias.py
          git rm .github/workflows/v5-promo-set-alias-one-shot.yml
          git add v5/card_identity_catalog.py
          git diff --cached --check
          git commit -m "fix(v5): resolve exact promo-prefix TCGdex aliases"
          git push origin HEAD:agent/v5-post-macro-applicability-retry
