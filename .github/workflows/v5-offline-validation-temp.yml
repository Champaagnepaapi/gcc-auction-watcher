name: V5 Offline Validation Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data

permissions:
  contents: read

jobs:
  validate-v5-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0 PyYAML==6.0.2

      - name: Verify V4 files are identical to current main
        shell: bash
        run: |
          git fetch origin main
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev '^(v5/|tests_v5/|\.github/workflows/v5-live-raw-pipeline-diagnostic\.yml$|\.github/workflows/v5-offline-validation-temp\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected non-V5 diff against main:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "V4/main files: identical"

      - name: Run complete current V4 tests
        run: python -m unittest discover -s tests -p 'test*.py' -v

      - name: Run complete current V5 tests
        run: python -m unittest discover -s tests_v5 -p 'test*.py' -v

      - name: Compile V5
        run: python -m compileall -q v5

      - name: Validate all workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path('.github/workflows').glob('*.y*ml'))
          for path in paths:
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'YAML OK: {path}')
          print(f'YAML workflows valid: {len(paths)}')
          PY

      - name: Check whitespace
        run: git diff --check origin/main...HEAD

      - name: Safety assertion
        run: |
          echo 'PokeTrace live calls requested by this workflow: 0'
          echo 'Secrets injected by this workflow: 0'
          echo 'Purchases/bids/checkout/CardGrader: 0'
