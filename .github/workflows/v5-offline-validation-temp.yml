name: V5 Offline Validation Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-v5-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0 PyYAML==6.0.2

      - name: Verify V4 files are identical to current main
        shell: bash
        run: |
          git fetch origin main
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev '^(v5/|tests_v5/|\.github/workflows/v5-live-raw-pipeline-diagnostic\.yml$|\.github/workflows/v5-offline-validation-temp\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected non-V5 diff against main:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "V4/main files: identical"

      - name: Run complete current V4 tests
        id: v4
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test*.py' -v 2>&1 | tee /tmp/v4-tests.log
          count="$(sed -nE 's/^Ran ([0-9]+) tests.*/\1/p' /tmp/v4-tests.log | tail -1)"
          test -n "$count"
          test "$count" -ge 167
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Run complete current V5 tests
        id: v5
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests_v5 -p 'test*.py' -v 2>&1 | tee /tmp/v5-tests.log
          count="$(sed -nE 's/^Ran ([0-9]+) tests.*/\1/p' /tmp/v5-tests.log | tail -1)"
          test -n "$count"
          test "$count" -ge 234
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Compile V5
        run: python -m compileall -q v5

      - name: Validate all workflow YAML
        id: yaml
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path('.github/workflows').glob('*.y*ml'))
          for path in paths:
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'YAML OK: {path}')
          print(f'YAML workflows valid: {len(paths)}')
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'count={len(paths)}\n')
          PY

      - name: Check whitespace
        run: git diff --check origin/main...HEAD

      - name: Safety assertion
        run: |
          echo 'PokeTrace live calls requested by this workflow: 0'
          echo 'Secrets injected by this workflow: 0'
          echo 'Purchases/bids/checkout/CardGrader: 0'

      - name: Report successful offline validation on PR 8
        if: success()
        uses: actions/github-script@v7
        env:
          V4_COUNT: ${{ steps.v4.outputs.count }}
          V5_COUNT: ${{ steps.v5.outputs.count }}
          YAML_COUNT: ${{ steps.yaml.outputs.count }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              '### Offline validation after current main → V5 resync',
              `run_id=${context.runId}`,
              `commit=${context.sha}`,
              `V4=${process.env.V4_COUNT}/${process.env.V4_COUNT}`,
              `V5=${process.env.V5_COUNT}/${process.env.V5_COUNT}`,
              'compileall_v5=OK',
              `workflow_yaml=${process.env.YAML_COUNT}/${process.env.YAML_COUNT}`,
              'git_diff_check=OK',
              'V4_files_vs_main=IDENTICAL',
              'PokeTrace_live_calls=0',
              'secrets_injected=0',
              'purchases_bids_checkout_cardgrader=0',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
              body,
            });
