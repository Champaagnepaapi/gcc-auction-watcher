name: V4 Global Confirmed Notifications

on:
  workflow_dispatch:
    inputs:
      max_evaluations:
        description: "Max pending marketplace listings to evaluate economically"
        required: false
        default: "50"
  # GitHub schedule remains the primary production trigger. The externally
  # dispatched Main Scanner is also used as a cheap watchdog: its completion
  # may recover this same lane only when the durable Global heartbeat is stale.
  schedule:
    - cron: "1,21,41 * * * *"
  workflow_run:
    workflows: ["GCC Auction Watcher"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: v4-global-confirmed-notifications
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_scan: ${{ steps.gate.outputs.run_scan }}
      production: ${{ steps.gate.outputs.production }}
      state_lane: ${{ steps.gate.outputs.state_lane }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Resolve Global production/watchdog gate
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const setGate = (runScan, production, stateLane, reason) => {
              core.setOutput('run_scan', runScan ? 'true' : 'false');
              core.setOutput('production', production ? 'true' : 'false');
              core.setOutput('state_lane', stateLane);
              core.setOutput('reason', reason);
              core.info(`global_gate run_scan=${runScan} production=${production} state_lane=${stateLane} reason=${reason}`);
            };

            if (context.eventName === 'workflow_dispatch') {
              setGate(true, false, 'workflow_dispatch', 'manual_dry_run');
              return;
            }

            const readHeartbeat = async () => {
              try {
                const data = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        comments(last: 50) {
                          nodes { body createdAt }
                        }
                      }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: 150,
                });
                const comments = data.repository?.issue?.comments?.nodes || [];
                const healthy = comments.filter((comment) => {
                  const body = comment.body || '';
                  const productionTrigger = body.includes('trigger=schedule') || body.includes('trigger=workflow_run');
                  const scanSucceeded = body.includes('scan_job_result=success');
                  const marketplaceSucceeded = body.includes('marketplace_status=success');
                  const intentionallyDisabled = body.includes('notification_activation=false');
                  return productionTrigger && scanSucceeded && (marketplaceSucceeded || intentionallyDisabled);
                });
                if (!healthy.length) {
                  return {ok: true, ageMinutes: Number.POSITIVE_INFINITY};
                }
                healthy.sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
                return {
                  ok: true,
                  ageMinutes: (Date.now() - Date.parse(healthy[0].createdAt)) / 60000,
                };
              } catch (error) {
                core.warning(`Global heartbeat lookup failed: ${error.message}`);
                return {ok: false, ageMinutes: Number.POSITIVE_INFINITY};
              }
            };

            if (context.eventName === 'schedule') {
              const heartbeat = await readHeartbeat();
              // Never let a registry/API problem suppress the primary schedule.
              if (!heartbeat.ok) {
                setGate(true, true, 'schedule', 'schedule_registry_unavailable_fail_open');
                return;
              }
              // A delayed/queued schedule immediately after a completed recovery
              // is redundant. Debounce only very recent healthy production runs.
              if (heartbeat.ageMinutes < 15) {
                setGate(false, true, 'schedule', 'schedule_debounced_recent_heartbeat');
                return;
              }
              setGate(true, true, 'schedule', 'scheduled_production');
              return;
            }

            if (context.eventName !== 'workflow_run') {
              setGate(false, false, 'workflow_dispatch', 'unsupported_trigger');
              return;
            }

            const source = context.payload.workflow_run || {};
            const trustedSource = source.name === 'GCC Auction Watcher'
              && source.event === 'workflow_dispatch'
              && source.head_branch === 'main'
              && source.conclusion === 'success';
            if (!trustedSource) {
              setGate(false, false, 'schedule', 'watchdog_untrusted_source');
              return;
            }

            const heartbeat = await readHeartbeat();
            // Recovery is fail-closed: if we cannot prove staleness, do nothing.
            if (!heartbeat.ok) {
              setGate(false, true, 'schedule', 'watchdog_registry_unavailable');
              return;
            }
            if (heartbeat.ageMinutes < 30) {
              setGate(false, true, 'schedule', 'watchdog_heartbeat_fresh');
              return;
            }

            try {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'v4-global-notify.yml',
                per_page: 20,
              });
              const activeStatuses = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
              const otherProductionRun = (response.data.workflow_runs || []).find((run) =>
                run.id !== context.runId
                && activeStatuses.has(run.status)
                && (run.event === 'schedule' || run.event === 'workflow_run')
              );
              if (otherProductionRun) {
                setGate(false, true, 'schedule', `watchdog_other_production_run_${otherProductionRun.id}`);
                return;
              }
            } catch (error) {
              core.warning(`Global active-run lookup failed: ${error.message}`);
              setGate(false, true, 'schedule', 'watchdog_active_run_lookup_unavailable');
              return;
            }

            // Reuse the legacy "schedule" cache namespace so watchdog recovery
            // continues exactly the same production state instead of bootstrapping.
            setGate(true, true, 'schedule', 'watchdog_stale_heartbeat_recovery');

  scan:
    needs: gate
    # Manual runs stay dry-run. Production is either the primary schedule or a
    # stale-heartbeat recovery admitted by the gate above.
    if: ${{ needs.gate.outputs.run_scan == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      notification_activation: ${{ steps.activation.outputs.enabled }}
      marketplace_status: ${{ steps.marketplace.outcome }}
      marketplace_timed_out: ${{ steps.marketplace.outputs.timed_out }}
    env:
      GLOBAL_NOTIFY_DEDUPE_TTL_DAYS: ${{ vars.GLOBAL_NOTIFY_DEDUPE_TTL_DAYS || '14' }}
      GLOBAL_NOTIFY_REPRICE_DROP_PCT: ${{ vars.GLOBAL_NOTIFY_REPRICE_DROP_PCT || '5' }}
      GLOBAL_TCGDEX_MAX_ATTEMPTS: "2"
      GLOBAL_TCGDEX_REQUEST_TIMEOUT_SECONDS: "10"
      GLOBAL_TCGDEX_RETRY_BACKOFF_SECONDS: "0.25"
      GLOBAL_PPT_MAX_HTTP_CALLS: "35"
      GLOBAL_PPT_MAX_CREDITS: "180"
      GLOBAL_PPT_DAILY_REMAINING_FLOOR: "15000"
      V4_POKETRACE_MAX_REQUESTS_PER_RUN: "60"
      GLOBAL_MARKETPLACE_MAX_EVALUATIONS: ${{ inputs.max_evaluations || '50' }}
      # The marketplace subprocess must end before the job-level timeout so
      # state/report cleanup and the separate registry job can still execute.
      GLOBAL_MARKETPLACE_WALL_TIMEOUT_SECONDS: "1020"
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      JAPAN_EDGE_NOTIFY_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve notification activation
        id: activation
        shell: bash
        env:
          REPO_NOTIFY_FLAG: ${{ vars.GLOBAL_NOTIFY_ENABLED }}
        run: |
          enabled=false
          if [ "${{ needs.gate.outputs.production }}" = "true" ]; then
            marker=false
            if [ -f .github/global-notify-activation ]; then
              marker="$(tr -d '[:space:]' < .github/global-notify-activation)"
            fi
            if [ "$REPO_NOTIFY_FLAG" = "false" ]; then
              enabled=false
            elif [ "$REPO_NOTIFY_FLAG" = "true" ]; then
              enabled=true
            elif [ "$marker" = "true" ]; then
              enabled=true
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "notification_activation=$enabled"

      - name: Set up Python
        if: ${{ needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore Playwright browser cache
        if: ${{ needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true' }}
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-python312-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: ${{ needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true' }}
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Ensure Chromium runtime is usable
        if: ${{ needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          set +e
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
          launch_status=$?
          set -e
          if [ "$launch_status" -ne 0 ]; then
            timeout 180s playwright install --with-deps chromium
          fi

      - name: Restore Global marketplace state
        if: ${{ needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .global-marketplace-state
          key: global-marketplace-state-${{ needs.gate.outputs.state_lane }}-${{ github.run_id }}
          restore-keys: |
            global-marketplace-state-${{ needs.gate.outputs.state_lane }}-

      - name: Run marketplace-first Global notification lane
        id: marketplace
        if: ${{ needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true' }}
        env:
          GLOBAL_NOTIFY_ENABLED: ${{ needs.gate.outputs.production == 'true' && steps.activation.outputs.enabled == 'true' && 'true' || 'false' }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s "${GLOBAL_MARKETPLACE_WALL_TIMEOUT_SECONDS}s" \
            python v4_global_marketplace_notify_resilient.py \
              --state-dir .global-marketplace-state \
              --output-dir global_marketplace_out \
              --max-evaluations "$GLOBAL_MARKETPLACE_MAX_EVALUATIONS" \
              --gcc-sold-pages 30 \
              --gcc-live-pages 100 \
              --browser-detail-cap 100 \
              --browser-scroll-rounds 15 \
              --comc-pages 10
          status=$?
          set -e

          timed_out=false
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            timed_out=true
          fi
          echo "timed_out=$timed_out" >> "$GITHUB_OUTPUT"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::error::Global marketplace lane exited status=$status timed_out=$timed_out"
            exit "$status"
          fi

      - name: Assert no tracked runtime mutation
        if: ${{ always() && (needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true') }}
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Save Global marketplace state
        # Never promote a partial/timed-out state snapshot.
        if: ${{ always() && steps.marketplace.outcome == 'success' && (needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: .global-marketplace-state
          key: global-marketplace-state-${{ needs.gate.outputs.state_lane }}-${{ github.run_id }}

      - name: Upload Global marketplace report
        if: ${{ always() && (needs.gate.outputs.production != 'true' || steps.activation.outputs.enabled == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: v4-global-marketplace-${{ github.run_id }}
          path: global_marketplace_out/
          if-no-files-found: ignore
          retention-days: 14

  register:
    # Keep the run registry outside the scan job. A job-level timeout/cancel can
    # otherwise prevent an in-job `always()` finalizer from ever running.
    needs: [gate, scan]
    if: ${{ always() && needs.gate.outputs.run_scan == 'true' && needs.gate.outputs.production == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download Global marketplace report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: v4-global-marketplace-${{ github.run_id }}
          path: global_marketplace_out

      - name: "Register Global production run in issue #150"
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_REASON: ${{ needs.gate.outputs.reason }}
          SCAN_JOB_RESULT: ${{ needs.scan.result }}
          NOTIFICATION_ACTIVATION: ${{ needs.scan.outputs.notification_activation }}
          MARKETPLACE_STATUS: ${{ needs.scan.outputs.marketplace_status }}
          MARKETPLACE_TIMED_OUT: ${{ needs.scan.outputs.marketplace_timed_out }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'global_marketplace_out/global_marketplace_report.json';
            let report = {};
            let reportStatus = 'missing';
            if (fs.existsSync(reportPath)) {
              try {
                report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                reportStatus = 'parsed';
              } catch (error) {
                reportStatus = 'parse_error';
              }
            }

            const discovery = report.marketplace_discovery || {};
            const inventory = discovery.inventory || {};
            const economic = report.economic_confirmation || {};
            const delivery = report.notification_delivery || {};
            const safety = report.safety || {};
            const value = (item) => item === undefined || item === null || item === '' ? 'unavailable' : String(item);

            const body = [
              `timestamp_utc=${new Date().toISOString()}`,
              `run_id=${context.runId}`,
              `run_attempt=${process.env.RUN_ATTEMPT}`,
              `trigger=${context.eventName}`,
              `trigger_reason=${process.env.TRIGGER_REASON || 'unavailable'}`,
              `commit_sha=${context.sha}`,
              `scan_job_result=${process.env.SCAN_JOB_RESULT || 'unavailable'}`,
              `notification_activation=${process.env.NOTIFICATION_ACTIVATION || 'unavailable'}`,
              `marketplace_status=${process.env.MARKETPLACE_STATUS || 'unavailable'}`,
              `marketplace_timed_out=${process.env.MARKETPLACE_TIMED_OUT || 'unavailable'}`,
              `report_status=${reportStatus}`,
              `mode=${value(report.mode)}`,
              `inventory_seen=${value(inventory.seen)}`,
              `inventory_new=${value(inventory.new)}`,
              `inventory_changed=${value(inventory.changed)}`,
              `inventory_missing_not_sold=${value(inventory.missing_not_sold)}`,
              `selected_for_evaluation=${value(discovery.selected_for_evaluation)}`,
              `acknowledged=${value(discovery.acknowledged)}`,
              `pending_after=${value(discovery.pending_after)}`,
              `tcgdex_external_exact=${value(economic.tcgdex_external_exact)}`,
              `ppt_matched=${value(economic.ppt_matched)}`,
              `ppt_http_calls=${value(economic.ppt_http_calls)}`,
              `ppt_credits=${value(economic.ppt_credits)}`,
              `ppt_daily_remaining=${value(economic.ppt_daily_remaining)}`,
              `ppt_blocked_reason=${value(economic.ppt_blocked_reason)}`,
              `poketrace_matched=${value(economic.poketrace_matched)}`,
              `poketrace_requests=${value(economic.poketrace_requests)}`,
              `market_conflicts_blocked=${value(economic.market_conflicts_blocked)}`,
              `confirmed_would_notify=${value(economic.confirmed_would_notify)}`,
              `confirmed_candidates=${value(delivery.confirmed_candidates)}`,
              `notifications_sent=${value(delivery.sent)}`,
              `identity_gate_relaxed=${value(safety.identity_gate_relaxed)}`,
              `automatic_purchase=${value(safety.automatic_purchase)}`,
              `automatic_bid=${value(safety.automatic_bid)}`,
              `automatic_checkout=${value(safety.automatic_checkout)}`,
              `automatic_payment=${value(safety.automatic_payment)}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 150,
              body,
            });
