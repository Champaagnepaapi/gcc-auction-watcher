name: V4 Global Confirmed Notifications

on:
  workflow_dispatch:
    inputs:
      max_identities:
        description: "Max rotating strict JP PSA10 identities to validate"
        required: false
        default: "5"
      market_candidates:
        description: "Max listing candidates per market/identity"
        required: false
        default: "8"
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: read

concurrency:
  group: v4-global-confirmed-notifications
  cancel-in-progress: false

jobs:
  scan:
    # Manual runs are always dry-run. Scheduled runs resolve an explicit
    # activation gate after checkout: repository variable first, then the
    # versioned activation marker. Literal repository variable false is an
    # emergency override that disables the marker.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GLOBAL_NOTIFY_DEDUPE_TTL_DAYS: ${{ vars.GLOBAL_NOTIFY_DEDUPE_TTL_DAYS || '14' }}
      GLOBAL_NOTIFY_REPRICE_DROP_PCT: ${{ vars.GLOBAL_NOTIFY_REPRICE_DROP_PCT || '5' }}
      GLOBAL_TCGDEX_MAX_ATTEMPTS: "2"
      GLOBAL_TCGDEX_REQUEST_TIMEOUT_SECONDS: "10"
      GLOBAL_TCGDEX_RETRY_BACKOFF_SECONDS: "0.25"
      GLOBAL_PPT_MAX_HTTP_CALLS: "12"
      GLOBAL_PPT_MAX_CREDITS: "60"
      GLOBAL_PPT_DAILY_REMAINING_FLOOR: "15000"
      GLOBAL_MAX_IDENTITIES: ${{ inputs.max_identities || '5' }}
      GLOBAL_MARKET_CANDIDATES: ${{ inputs.market_candidates || '8' }}
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      JAPAN_EDGE_NOTIFY_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve notification activation
        id: activation
        shell: bash
        env:
          REPO_NOTIFY_FLAG: ${{ vars.GLOBAL_NOTIFY_ENABLED }}
        run: |
          enabled=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            marker=false
            if [ -f .github/global-notify-activation ]; then
              marker="$(tr -d '[:space:]' < .github/global-notify-activation)"
            fi
            if [ "$REPO_NOTIFY_FLAG" = "false" ]; then
              enabled=false
            elif [ "$REPO_NOTIFY_FLAG" = "true" ]; then
              enabled=true
            elif [ "$marker" = "true" ]; then
              enabled=true
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "notification_activation=$enabled"

      - name: Set up Python
        if: ${{ github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore Playwright browser cache
        if: ${{ github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true' }}
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-python312-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true' }}
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Ensure Chromium runtime is usable
        if: ${{ github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          set +e
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
          launch_status=$?
          set -e
          if [ "$launch_status" -ne 0 ]; then
            timeout 180s playwright install --with-deps chromium
          fi

      - name: Restore Global notification state
        if: ${{ github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .global-notify-state
          key: global-notify-state-${{ github.event_name }}-${{ github.run_id }}
          restore-keys: |
            global-notify-state-${{ github.event_name }}-

      - name: Run confirmed Global notification lane
        if: ${{ github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true' }}
        env:
          GLOBAL_NOTIFY_ENABLED: ${{ github.event_name == 'schedule' && steps.activation.outputs.enabled == 'true' && 'true' || 'false' }}
        run: |
          python v4_global_notify_resilient.py \
            --state .global-notify-state/state.json \
            --output-dir global_notify_out \
            --max-identities "$GLOBAL_MAX_IDENTITIES" \
            --market-candidates "$GLOBAL_MARKET_CANDIDATES"

      - name: Assert no tracked runtime mutation
        if: ${{ github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true' }}
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Save Global notification state
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: .global-notify-state
          key: global-notify-state-${{ github.event_name }}-${{ github.run_id }}

      - name: Upload Global notification report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.activation.outputs.enabled == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: v4-global-notify-${{ github.run_id }}
          path: global_notify_out/
          if-no-files-found: ignore
          retention-days: 14
