name: Japan Edge Global Live Once

on:
  push:
    branches:
      - feat/japan-edge-global-market-context
    paths:
      - ".github/workflows/japan-edge-global-live-once.yml"

permissions:
  contents: read

jobs:
  live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAPAN_EDGE_GCC_PAGES: "20"
      JAPAN_EDGE_MAX_SEEDS_PER_RUN: "12"
      JAPAN_EDGE_MAX_ITEMS_PER_SEARCH: "25"
      JAPAN_EDGE_MIN_DISCOUNT_PCT: "30"
      JAPAN_EDGE_PROXY_FIXED_JPY: "500"
      JAPAN_EDGE_LOGISTICS_BUFFER_PCT: "12"
      JAPAN_EDGE_GLOBAL_MAX_CANDIDATES: "12"
      V4_POKETRACE_MAX_REQUESTS_PER_RUN: "20"
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run V3 read-only scan
        run: python japan_edge_hunter_v3.py --state .japan-edge-live-v3/state.json --output japan_edge_global_live_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-edge-global-live-${{ github.run_id }}
          path: japan_edge_global_live_report.json
          if-no-files-found: ignore
          retention-days: 14
