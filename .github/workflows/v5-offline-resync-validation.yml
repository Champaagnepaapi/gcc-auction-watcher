name: V5 Offline Resync Validation

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V5 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0 pytest

      - name: Disable live and paid providers
        shell: bash
        run: |
          echo "CARDGRADER_V5_ALLOW_PAID_CALLS=false" >> "$GITHUB_ENV"
          echo "PRICECHARTING_ENABLED=false" >> "$GITHUB_ENV"
          echo "POKETRACE_ENABLED=false" >> "$GITHUB_ENV"

      - name: Run V5 offline tests
        shell: bash
        run: |
          unset EBAY_CLIENT_ID EBAY_CLIENT_SECRET POKETRACE_API_KEY JUSTTCG_API_KEY CARDGRADER_API_KEY
          python -m unittest discover -s tests_v5 -v

      - name: Run V4 regression tests
        shell: bash
        run: |
          unset EBAY_CLIENT_ID EBAY_CLIENT_SECRET POKETRACE_API_KEY JUSTTCG_API_KEY CARDGRADER_API_KEY
          python -m pytest tests/ -q

      - name: Compile Python
        run: python -m compileall -q v5 watcher.py run_final_auction_check.py

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
