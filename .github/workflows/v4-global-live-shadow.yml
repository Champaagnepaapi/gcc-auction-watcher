name: V4 Global Market Live Shadow

on:
  workflow_dispatch:
    inputs:
      max_identities:
        description: "Max strict JP PSA10 identities to benchmark"
        required: false
        default: "5"
      market_candidates:
        description: "Max listing candidates per market/identity"
        required: false
        default: "8"
      rejection_diagnostics:
        description: "Run legacy rejection diagnostic instead of hardened shadow"
        required: false
        type: boolean
        default: false
      economic_confirmation:
        description: "Run read-only PPT/PokeTrace economic confirmation diagnostic"
        required: false
        type: boolean
        default: false
  # Temporary branch-local self-launch. This exists only so the authorized
  # read-only validation can be started through the connected GitHub writer.
  push:
    branches:
      - feat/v4-global-economic-confirmation-20260819
    paths:
      - .github/workflows/v4-global-live-shadow.yml

permissions:
  contents: read

concurrency:
  group: v4-global-live-shadow
  cancel-in-progress: true

jobs:
  live-shadow:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops(global): self launch economic confirmation' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NTFY_TOPIC: ""
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject incompatible diagnostic modes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rejection_diagnostics && inputs.economic_confirmation }}
        run: |
          echo "::error::Choose rejection_diagnostics OR economic_confirmation, not both."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-python312-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Ensure Chromium runtime is usable
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Playwright browser cache miss: downloading Chromium"
            playwright install chromium
          else
            echo "Playwright browser cache hit: Chromium payload restored"
          fi

          set +e
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
          launch_status=$?
          set -e

          if [ "$launch_status" -ne 0 ]; then
            echo "Chromium launch probe failed; bounded dependency repair"
            timeout 180s playwright install --with-deps chromium
            python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
          fi

      - name: Run hardened read-only multi-market shadow
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.rejection_diagnostics && !inputs.economic_confirmation }}
        run: |
          python v4_global_live_shadow_hardened.py \
            --output-dir global_shadow_out \
            --max-identities "${{ inputs.max_identities }}" \
            --market-candidates "${{ inputs.market_candidates }}"

      - name: Run read-only economic confirmation diagnostic
        if: ${{ github.event_name == 'push' || (inputs.economic_confirmation && !inputs.rejection_diagnostics) }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            max_identities="5"
            market_candidates="8"
          else
            max_identities="${{ inputs.max_identities }}"
            market_candidates="${{ inputs.market_candidates }}"
          fi
          python v4_global_live_confirmed.py \
            --output-dir global_shadow_out \
            --max-identities "$max_identities" \
            --market-candidates "$market_candidates"

      - name: Run legacy read-only rejection diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rejection_diagnostics && !inputs.economic_confirmation }}
        run: |
          python v4_global_rejection_diagnostics.py \
            --output-dir global_shadow_out \
            --max-identities "${{ inputs.max_identities }}" \
            --market-candidates "${{ inputs.market_candidates }}"

      - name: Assert no tracked runtime mutation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v4-global-market-live-shadow-${{ github.run_id }}
          path: global_shadow_out/
          if-no-files-found: error
          retention-days: 7
