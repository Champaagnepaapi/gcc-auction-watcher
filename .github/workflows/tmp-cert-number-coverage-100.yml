name: Temporary cert number coverage 100

on:
  push:
    branches:
      - diag/cert-number-coverage-100-20260815
    paths:
      - .github/workflows/tmp-cert-number-coverage-100.yml

permissions:
  contents: read

jobs:
  cert-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sample 100 active Pokemon fixed cards read-only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from collections import Counter

          API = "https://api.gradedcardcenter.com/on-sale-items"
          BASE = "https://gradedcardcenter.com/item/{}"
          params = {
              "sellingTypes": "FIXED_PRICE",
              "categories": "Pokemon",
              "itemTypes": "CARDS",
              "page": 1,
              "limit": 100,
              "includeCounts": "true",
          }
          url = API + "?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as r:
              payload = json.loads(r.read().decode("utf-8"))
          rows = payload.get("results") if isinstance(payload, dict) else None
          if not isinstance(rows, list):
              raise SystemExit("malformed GCC payload")
          rows = [r for r in rows if isinstance(r, dict) and r.get("id")][:100]

          def digits(value):
              if value is None:
                  return ""
              s = re.sub(r"\D", "", str(value))
              return s if 5 <= len(s) <= 14 else ""

          def direct_serial(row):
              item = row.get("item") if isinstance(row.get("item"), dict) else {}
              for value in (
                  item.get("serialNumber"), item.get("certificationNumber"),
                  item.get("certificateNumber"), item.get("certNumber"),
                  row.get("serialNumber"), row.get("certificationNumber"),
                  row.get("certificateNumber"), row.get("certNumber"),
              ):
                  s = digits(value)
                  if s:
                      return s
              return ""

          def grader_of(row):
              item = row.get("item") if isinstance(row.get("item"), dict) else {}
              grading = item.get("grading") if isinstance(item.get("grading"), dict) else {}
              vals = [
                  grading.get("company"), grading.get("grader"), grading.get("name"),
                  item.get("grader"), item.get("gradingCompany"),
                  row.get("grader"), row.get("gradingCompany"),
              ]
              for v in vals:
                  if isinstance(v, dict):
                      v = v.get("name") or v.get("acronym") or v.get("code")
                  if v:
                      return str(v).strip().upper()
              return "UNKNOWN"

          api_found = 0
          detail_found = 0
          missing = 0
          detail_errors = 0
          by_grader = Counter()
          by_grader_found = Counter()

          patterns = [
              re.compile(r'"(?:serialNumber|certificationNumber|certificateNumber|certNumber)"\s*:\s*"?([0-9][0-9 .-]{4,18})', re.I),
              re.compile(r'(?:Num[ée]ro de s[ée]rie|Serial Number|Certification Number|Certificate Number|Cert(?:ification)?(?: Number)?)\s*:?\s*</?[^>]*>?\s*([0-9][0-9 .-]{4,18})', re.I),
          ]

          for row in rows:
              grader = grader_of(row)
              by_grader[grader] += 1
              s = direct_serial(row)
              if s:
                  api_found += 1
                  by_grader_found[grader] += 1
                  continue
              detail_url = BASE.format(row["id"])
              try:
                  req = urllib.request.Request(detail_url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      html = r.read().decode("utf-8", "ignore")
                  found = ""
                  for pat in patterns:
                      m = pat.search(html)
                      if m:
                          found = digits(m.group(1))
                          if found:
                              break
                  if found:
                      detail_found += 1
                      by_grader_found[grader] += 1
                  else:
                      missing += 1
              except Exception:
                  detail_errors += 1
                  missing += 1

          total = len(rows)
          found_total = api_found + detail_found
          print("=== CERT NUMBER COVERAGE 100 — READ ONLY ===")
          print(f"sample_total={total}")
          print(f"cert_found_total={found_total}")
          print(f"cert_found_api={api_found}")
          print(f"cert_found_detail_html_fallback={detail_found}")
          print(f"cert_missing_after_fallback={missing}")
          print(f"detail_fetch_errors={detail_errors}")
          print(f"coverage_pct={(100.0 * found_total / total) if total else 0:.1f}")
          print("grader_counts=" + json.dumps(dict(sorted(by_grader.items())), ensure_ascii=False, sort_keys=True))
          print("grader_cert_found=" + json.dumps(dict(sorted(by_grader_found.items())), ensure_ascii=False, sort_keys=True))
          print("economic_actions=0")
          print("ntfy_actions=0")
          print("state_writes=0")
          PY
