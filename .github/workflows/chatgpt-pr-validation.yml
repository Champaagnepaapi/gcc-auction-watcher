name: ChatGPT temporary PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0 PyYAML
      - name: V4 tests
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: V5 tests
        run: python -m unittest discover -s tests_v5 -p 'test*.py'
      - name: Compile changed identity files
        run: python -m py_compile v5/poketrace_identity.py v5/market_values/poketrace_free.py tests_v5/test_poketrace_identity.py tests_v5/test_poketrace_free.py
      - name: Validate YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for name in (
              '.github/workflows/v5-live-raw-pipeline-diagnostic.yml',
              '.github/workflows/chatgpt-pr-validation.yml',
          ):
              path = pathlib.Path(name)
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'YAML OK: {path}')
          PY
      - name: Diff check
        run: git diff --check
