name: ChatGPT GCC cumulative index CI

on:
  push:
    branches:
      - chatgpt-gcc-cumulative-index-20260810
    paths:
      - .github/workflows/chatgpt-gcc-cumulative-index-ci.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-gcc-cumulative-index-20260810
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0 PyYAML

      - name: Apply cumulative-index integration patch
        run: python .github/scripts/chatgpt_apply_gcc_cumulative_index.py

      - name: Run V4 tests
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Run V5 tests
        run: python -m unittest discover -s tests_v5 -p 'test*.py'

      - name: Compile modified Python
        run: python -m py_compile v5/gcc_catalog_cache.py v5/gcc_live_adapter.py v5/live_raw_pipeline.py tests_v5/test_gcc_catalog_cache.py tests_v5/test_gcc_live_adapter_matching.py

      - name: Validate workflows
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in (
              pathlib.Path('.github/workflows/v5-live-raw-pipeline-diagnostic.yml'),
              pathlib.Path('.github/workflows/v5-gcc-catalog-refresh.yml'),
          ):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print(f'YAML OK: {path}')
          PY

      - name: Diff check
        run: git diff --check

      - name: Safety check
        run: |
          grep -q 'Persisted eBay records: 0' v5/gcc_catalog_cache.py
          ! grep -Ei 'seller|localizedAspects|primary_image|item_id' v5/gcc_catalog_cache.py

      - name: Commit tested implementation
        run: |
          git config user.name "chatgpt-maintenance[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5/gcc_catalog_cache.py v5/gcc_live_adapter.py v5/live_raw_pipeline.py tests_v5/test_gcc_catalog_cache.py tests_v5/test_gcc_live_adapter_matching.py .github/workflows/v5-live-raw-pipeline-diagnostic.yml .github/workflows/v5-gcc-catalog-refresh.yml
          git commit -m "feat: persist cumulative GCC identity catalogue"
          git push origin HEAD:chatgpt-gcc-cumulative-index-20260810
