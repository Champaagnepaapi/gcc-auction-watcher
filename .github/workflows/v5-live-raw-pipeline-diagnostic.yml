name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

# Branch-only Source Scout validation reusing the existing visible manual workflow.
# PokemonPriceTracker paid-plan benchmark only: max 50 HTTP calls, max 500 API
# credits, and fail-closed if daily remaining reaches 15,000. No GCC session,
# CMAPI/eBay ASP key, Neon write, purchase, bid, checkout or paid grading.
jobs:
  source-scout-ppt-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify intended Source Scout branch
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "agent/source-scout-ppt-cardinality-20260815"
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.4

      - name: Compile isolated Source Scout modules
        run: |
          python -m py_compile \
            catalog_cardinality.py \
            robot_kb_ebay_asp_policy.py \
            v5/pokemonpricetracker_adapter.py \
            v5/pokemonpricetracker_contract_probe.py \
            v5/pokemonpricetracker_full_benchmark.py \
            tests/test_catalog_cardinality.py \
            tests/test_robot_kb_ebay_asp_policy.py \
            tests/test_pokemonpricetracker_adapter.py \
            tests/test_pokemonpricetracker_contract_probe.py \
            tests/test_pokemonpricetracker_full_benchmark.py

      - name: Run focused deterministic tests
        run: |
          python -m unittest \
            tests.test_catalog_cardinality \
            tests.test_robot_kb_ebay_asp_policy \
            tests.test_pokemonpricetracker_adapter \
            tests.test_pokemonpricetracker_contract_probe \
            tests.test_pokemonpricetracker_full_benchmark -v

      - name: Run full bounded PokemonPriceTracker paid-plan benchmark
        run: python -m v5.pokemonpricetracker_full_benchmark

      - name: Publish full benchmark summary
        if: always() && hashFiles('pokemonpricetracker_full_benchmark.md') != ''
        shell: bash
        run: cat pokemonpricetracker_full_benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full raw evidence
        if: always() && hashFiles('pokemonpricetracker_full_benchmark.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pokemonpricetracker-full-benchmark-${{ github.run_id }}
          path: |
            pokemonpricetracker_full_benchmark.json
            pokemonpricetracker_full_benchmark.md
          if-no-files-found: error
          retention-days: 14
