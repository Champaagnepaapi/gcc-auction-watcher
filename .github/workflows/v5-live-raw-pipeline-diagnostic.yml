name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-live-raw-pipeline-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      GCC_SESSION_B64: ${{ secrets.GCC_SESSION_B64 }}
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      POKETRACE_ENABLED: "true"
      POKETRACE_PLAN: "free"
      POKETRACE_RESULT_LIMIT: "20"
      # Compatibility input; FreeTierPokeTraceProvider enforces >=2.25s at runtime.
      POKETRACE_MIN_REQUEST_INTERVAL_SECONDS: "2.05"
      POKETRACE_CARDMARKET_DISCOUNT_THRESHOLD: "0.30"
      POKETRACE_FALLING_MARKET_THRESHOLD: "0.10"
      V5_PROGRESS_LOGS: "true"
      V5_LIVE_RAW_RESULT_LIMIT: "20"
      V5_LIVE_INCLUDE_EBAY_CH: "false"
      # Only ambiguous/insufficient RAW identities are sent through this local
      # image matcher. It downloads eBay/PokeTrace images in memory and performs
      # no OCR/model API call and no image persistence.
      V5_VISUAL_IDENTITY_ENABLED: "true"
      V5_VISUAL_IDENTITY_MAX_CANDIDATES: "8"
      V5_VISUAL_IDENTITY_MAX_EBAY_IMAGES: "3"
      V5_VISUAL_IDENTITY_MIN_SCORE: "0.74"
      V5_VISUAL_IDENTITY_MIN_MARGIN: "0.08"
      # Overriding a structured eBay card number requires stronger evidence.
      V5_VISUAL_IDENTITY_OVERRIDE_NUMBER_MIN_SCORE: "0.82"
      V5_VISUAL_IDENTITY_OVERRIDE_NUMBER_MIN_MARGIN: "0.12"
      PRICECHARTING_ENABLED: "false"
      MARKETPLACE_INSIGHTS_ENABLED: "false"
      GCC_HISTORY_ENABLED: "true"
      # Temporary validation switch: keep the existing GCC workflow contract
      # and cumulative cache, but do not execute the expensive Playwright
      # representative/history fallback while measuring identity quality.
      V5_SKIP_GCC_LIVE_FOR_POKETRACE_VALIDATION: "true"
      GCC_HISTORY_CURRENCY: USD
      GCC_CATALOG_INDEX_FILE: gcc_catalog_index.json
      PRODUCT_RESEARCH_MODE: "MANUAL_VALIDATION_ONLY"
      RAW_MAX_PAID_GRADINGS_PER_RUN: "0"
      CARDGRADER_V5_ALLOW_PAID_CALLS: "false"
      BUYER_FEES: ${{ vars.V5_BUYER_FEES_USD }}
      DOMESTIC_SHIPPING: ${{ vars.V5_DOMESTIC_SHIPPING_USD }}
      INTERNATIONAL_SHIPPING: ${{ vars.V5_INTERNATIONAL_SHIPPING_USD }}
      GRADING_FEE: ${{ vars.V5_GRADING_FEE_USD }}
      GRADING_SHIPPING: ${{ vars.V5_GRADING_SHIPPING_USD }}
      VAULT_FEE: ${{ vars.V5_VAULT_FEE_USD }}
      SELLING_FEE_PCT: ${{ vars.V5_SELLING_FEE_PCT }}
      SELLING_FIXED_FEE: ${{ vars.V5_SELLING_FIXED_FEE_USD }}
      FX_BUFFER_PCT: ${{ vars.V5_FX_BUFFER_PCT }}
      OTHER_COSTS: ${{ vars.V5_OTHER_COSTS_USD }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore cumulative GCC catalogue
        uses: actions/cache/restore@v4
        with:
          path: gcc_catalog_index.json
          key: v5-gcc-catalog-${{ github.run_id }}
          restore-keys: |
            v5-gcc-catalog-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only diagnostic dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0
          if [ "${V5_SKIP_GCC_LIVE_FOR_POKETRACE_VALIDATION}" != "true" ]; then
            playwright install --with-deps chromium
          fi

      - name: Prepare existing authenticated GCC session
        shell: bash
        run: |
          if [ -z "${GCC_SESSION_B64:-}" ]; then
            echo "GCC authenticated session: MISSING"
            exit 1
          fi
          printf '%s' "$GCC_SESSION_B64" | base64 --decode > gcc_session.json
          echo "GCC authenticated session: READY"

      - name: Run fast V5 hybrid identity + local visual diagnostic
        run: python -m v5.live_raw_pipeline_catalog

      - name: Save cumulative GCC catalogue even after diagnostic failure
        if: ${{ always() && hashFiles('gcc_catalog_index.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: gcc_catalog_index.json
          key: v5-gcc-catalog-${{ github.run_id }}

      - name: Remove ephemeral GCC session
        if: always()
        run: rm -f gcc_session.json
