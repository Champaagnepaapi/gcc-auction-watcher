name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

# Branch-local Source Scout override.
# Dedicated one-call CMAPI endpoint diagnostic only.
# main and PR #8 remain untouched.
jobs:
  source-scout-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CMAPI_RAPIDAPI_KEY: ${{ secrets.CMAPI_RAPIDAPI_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected benchmark branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install read-only benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile one-call CMAPI probe
        run: |
          python -m py_compile \
            v5/source_scout_benchmark.py \
            v5/source_scout_language_entrypoint.py \
            v5/source_scout_cmapi_v2_entrypoint.py \
            tests_v5/test_source_scout_benchmark.py

      - name: Run Source Scout safety tests
        run: python -m unittest tests_v5.test_source_scout_benchmark -v

      - name: Run exactly one CMAPI Search for Cards request
        run: python -m v5.source_scout_cmapi_v2_entrypoint

      - name: Publish CMAPI probe summary
        if: always() && hashFiles('cmapi_probe.md') != ''
        shell: bash
        run: cat cmapi_probe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized CMAPI probe
        if: always() && hashFiles('cmapi_probe.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cmapi-one-call-probe-${{ github.run_id }}
          path: |
            cmapi_probe.json
            cmapi_probe.md
          if-no-files-found: error
          retention-days: 14
