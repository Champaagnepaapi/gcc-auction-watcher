name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

# Branch-local Source Scout override.
# Four-call CMAPI liquid-card sentinel only; main and PR #8 remain untouched.
jobs:
  source-scout-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CMAPI_RAPIDAPI_KEY: ${{ secrets.CMAPI_RAPIDAPI_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected benchmark branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install read-only benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile bounded CMAPI liquid sentinel
        run: |
          python -m py_compile \
            v5/source_scout_benchmark.py \
            v5/source_scout_cmapi_v2_entrypoint.py \
            v5/source_scout_cmapi_v3_entrypoint.py \
            v5/source_scout_cmapi_liquid_sentinel.py \
            tests_v5/test_source_scout_benchmark.py \
            tests_v5/test_source_scout_cmapi_v3.py \
            tests_v5/test_source_scout_cmapi_liquid_sentinel.py

      - name: Run CMAPI focused safety and parser tests
        run: |
          python -m unittest \
            tests_v5.test_source_scout_benchmark \
            tests_v5.test_source_scout_cmapi_v3 \
            tests_v5.test_source_scout_cmapi_liquid_sentinel -v

      - name: Run four-call Umbreon VMAX Evolving Skies CMAPI sentinel
        run: python -m v5.source_scout_cmapi_liquid_sentinel

      - name: Publish CMAPI liquid sentinel summary
        if: always() && hashFiles('cmapi_liquid_sentinel.md') != ''
        shell: bash
        run: cat cmapi_liquid_sentinel.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized CMAPI liquid sentinel evidence
        if: always() && hashFiles('cmapi_liquid_sentinel.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cmapi-liquid-sentinel-${{ github.run_id }}
          path: |
            cmapi_liquid_sentinel.json
            cmapi_liquid_sentinel.md
          if-no-files-found: error
          retention-days: 14
