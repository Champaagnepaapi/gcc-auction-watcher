name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

# Branch-only Source Scout validation. This deliberately reuses an existing
# visible manual workflow so no throwaway workflow is added to main.
# PokemonPriceTracker: max 6 HTTP calls, 3 liquid sentinels, raw schema artifact.
# No GCC session, CMAPI/eBay ASP key, Neon write, purchase, bid or checkout.
jobs:
  source-scout-ppt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify intended Source Scout branch
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "agent/source-scout-ppt-cardinality-20260815"
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.4

      - name: Compile isolated Source Scout modules
        run: |
          python -m py_compile \
            catalog_cardinality.py \
            robot_kb_ebay_asp_policy.py \
            v5/pokemonpricetracker_adapter.py \
            v5/pokemonpricetracker_contract_probe.py \
            tests/test_catalog_cardinality.py \
            tests/test_robot_kb_ebay_asp_policy.py \
            tests/test_pokemonpricetracker_adapter.py \
            tests/test_pokemonpricetracker_contract_probe.py

      - name: Run focused deterministic tests
        run: |
          python -m unittest \
            tests.test_catalog_cardinality \
            tests.test_robot_kb_ebay_asp_policy \
            tests.test_pokemonpricetracker_adapter \
            tests.test_pokemonpricetracker_contract_probe -v

      - name: Run bounded PokemonPriceTracker live contract probe
        run: python -m v5.pokemonpricetracker_contract_probe

      - name: Publish probe summary
        if: always() && hashFiles('pokemonpricetracker_contract_probe.md') != ''
        shell: bash
        run: cat pokemonpricetracker_contract_probe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw schema evidence
        if: always() && hashFiles('pokemonpricetracker_contract_probe.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pokemonpricetracker-contract-probe-${{ github.run_id }}
          path: |
            pokemonpricetracker_contract_probe.json
            pokemonpricetracker_contract_probe.md
          if-no-files-found: error
          retention-days: 14
