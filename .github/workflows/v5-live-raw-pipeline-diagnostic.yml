name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Branch-local evidence replay + PPT opportunity validation.
# CMAPI key is deliberately absent: this workflow cannot spend RapidAPI quota.
# main and PR #8 remain untouched.
jobs:
  source-scout-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected benchmark branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install read-only benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile evidence replay and PPT validation
        run: |
          python -m py_compile \
            v5/source_scout_benchmark.py \
            v5/source_scout_opportunity_benchmark.py \
            v5/source_scout_paid_entrypoint.py \
            v5/source_scout_paid_v2_entrypoint.py \
            v5/source_scout_paid_v3_entrypoint.py \
            v5/source_scout_opportunity_ppt_validation.py \
            v5/source_scout_opportunity_ppt_validation_v2.py \
            v5/cmapi_sold_identity_uniqueness.py \
            v5/neon_cmapi_ingest.py \
            v5/neon_cmapi_ingest_v2.py \
            v5/neon_cmapi_ingest_v3.py \
            v5/neon_source_scout_ingest.py \
            v5/neon_source_scout_ingest_v2.py \
            tests_v5/test_source_scout_benchmark.py \
            tests_v5/test_source_scout_opportunity_ppt_validation.py \
            tests_v5/test_cmapi_sold_identity_uniqueness.py

      - name: Run focused identity and PPT safety tests
        run: |
          python -m unittest \
            tests_v5.test_source_scout_benchmark \
            tests_v5.test_source_scout_opportunity_ppt_validation \
            tests_v5.test_cmapi_sold_identity_uniqueness -v

      - name: Download prior CMAPI benchmark evidence without new CMAPI calls
        uses: actions/download-artifact@v4
        with:
          name: opportunity-source-benchmark-31871803238
          path: prior-cmapi
          repository: Champaagnepaapi/gcc-auction-watcher
          run-id: 31871803238
          github-token: ${{ github.token }}

      - name: Replay prior CMAPI evidence through catalog uniqueness gate
        if: ${{ env.NEON_DATABASE_URL != '' }}
        shell: bash
        run: |
          cp prior-cmapi/cmapi_opportunity_evidence.json cmapi_opportunity_evidence.json
          python -m v5.neon_cmapi_ingest_v3

      - name: Run opportunity PPT validation with zero CMAPI calls
        run: python -m v5.source_scout_opportunity_ppt_validation_v2

      - name: Persist validated PokemonPriceTracker evidence to Neon
        if: ${{ env.NEON_DATABASE_URL != '' && hashFiles('pokemonpricetracker_evidence.json') != '' }}
        run: python -m v5.neon_source_scout_ingest_v2

      - name: Publish PPT validation summary
        if: always() && hashFiles('source_scout_opportunity_ppt_report.md') != ''
        shell: bash
        run: cat source_scout_opportunity_ppt_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PPT validation evidence
        if: always() && hashFiles('source_scout_opportunity_ppt_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-ppt-validation-${{ github.run_id }}
          path: |
            source_scout_opportunity_ppt_report.json
            source_scout_opportunity_ppt_report.md
            pokemonpricetracker_evidence.json
            pokemonpricetracker_probe.json
          if-no-files-found: error
          retention-days: 14
