name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:
    inputs:
      cmapi_remaining_confirmed:
        description: "RapidAPI CardMarket API TCG requests remaining today (must be >=90)"
        required: true
        type: number

permissions:
  contents: read

# Branch-local Source Scout override for one explicit benchmark phase.
# 12 high-value/liquidity proxy prints x EN/FR; CMAPI hard-stops before overage.
# main and PR #8 remain untouched.
jobs:
  source-scout-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      CMAPI_RAPIDAPI_KEY: ${{ secrets.CMAPI_RAPIDAPI_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CMAPI_REMAINING_CONFIRMED: ${{ inputs.cmapi_remaining_confirmed }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected benchmark branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install read-only benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate confirmed CMAPI free quota before any provider call
        shell: bash
        run: |
          python - <<'PY'
          import os
          value = int(os.environ["CMAPI_REMAINING_CONFIRMED"])
          if value < 90:
              raise SystemExit(f"CMAPI safety stop before first call: confirmed remaining={value}, require >=90")
          print(f"CMAPI_PRECHECK confirmed_remaining={value} required_minimum=90")
          PY

      - name: Compile opportunity benchmark and Neon ingesters
        run: |
          python -m py_compile \
            v5/source_scout_benchmark.py \
            v5/source_scout_language_entrypoint.py \
            v5/source_scout_paid_v2_entrypoint.py \
            v5/source_scout_cmapi_v2_entrypoint.py \
            v5/source_scout_cmapi_v3_entrypoint.py \
            v5/source_scout_opportunity_benchmark.py \
            v5/source_scout_opportunity_benchmark_v2.py \
            v5/source_scout_opportunity_benchmark_v3.py \
            v5/neon_source_scout_ingest.py \
            v5/neon_source_scout_ingest_v2.py \
            v5/neon_cmapi_ingest.py \
            v5/neon_cmapi_ingest_v2.py \
            tests_v5/test_source_scout_benchmark.py \
            tests_v5/test_source_scout_cmapi_v3.py \
            tests_v5/test_source_scout_opportunity_benchmark.py \
            tests_v5/test_source_scout_opportunity_benchmark_v2.py \
            tests_v5/test_source_scout_opportunity_benchmark_v3.py \
            tests_v5/test_neon_cmapi_ingest.py \
            tests_v5/test_neon_cmapi_ingest_v2.py

      - name: Run focused source and safety tests
        run: |
          python -m unittest \
            tests_v5.test_source_scout_benchmark \
            tests_v5.test_source_scout_cmapi_v3 \
            tests_v5.test_source_scout_opportunity_benchmark \
            tests_v5.test_source_scout_opportunity_benchmark_v2 \
            tests_v5.test_source_scout_opportunity_benchmark_v3 \
            tests_v5.test_neon_cmapi_ingest \
            tests_v5.test_neon_cmapi_ingest_v2 -v

      - name: Run bounded EN FR opportunity provider benchmark
        run: python -m v5.source_scout_opportunity_benchmark_v3

      - name: Persist PokemonPriceTracker evidence to Neon
        if: ${{ env.NEON_DATABASE_URL != '' && hashFiles('pokemonpricetracker_evidence.json') != '' }}
        run: python -m v5.neon_source_scout_ingest_v2

      - name: Persist clean CMAPI evidence and proven SOLD to Neon
        if: ${{ env.NEON_DATABASE_URL != '' && hashFiles('cmapi_opportunity_evidence.json') != '' }}
        run: python -m v5.neon_cmapi_ingest_v2

      - name: Publish opportunity benchmark summary
        if: always() && hashFiles('source_scout_opportunity_report.md') != ''
        shell: bash
        run: cat source_scout_opportunity_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provider comparison and raw evidence
        if: always() && hashFiles('source_scout_opportunity_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-source-benchmark-${{ github.run_id }}
          path: |
            source_scout_opportunity_report.json
            source_scout_opportunity_report.md
            cmapi_opportunity_evidence.json
            pokemonpricetracker_evidence.json
            pokemonpricetracker_jp_probe.json
          if-no-files-found: error
          retention-days: 14
