name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-live-raw-pipeline-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      V5_LIVE_RAW_RESULT_LIMIT: "20"
      V5_LIVE_INCLUDE_EBAY_CH: "false"
      PRICECHARTING_ENABLED: "false"
      MARKETPLACE_INSIGHTS_ENABLED: "false"
      PRODUCT_RESEARCH_MODE: "MANUAL_VALIDATION_ONLY"
      RAW_MAX_PAID_GRADINGS_PER_RUN: "0"
      CARDGRADER_V5_ALLOW_PAID_CALLS: "false"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only diagnostic dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.4 Pillow==12.3.0

      - name: Run aggregate-only V5 live raw pipeline
        run: python -m v5.live_raw_pipeline
