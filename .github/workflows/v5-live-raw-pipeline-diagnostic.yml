name: V5 Live Raw Pipeline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

# Branch-local Source Scout override.
# Bounded CMAPI benchmark only; main and PR #8 remain untouched.
jobs:
  source-scout-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CMAPI_RAPIDAPI_KEY: ${{ secrets.CMAPI_RAPIDAPI_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected benchmark branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install read-only benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile bounded CMAPI benchmark
        run: |
          python -m py_compile \
            v5/source_scout_benchmark.py \
            v5/source_scout_language_entrypoint.py \
            v5/source_scout_cmapi_v2_entrypoint.py \
            v5/source_scout_cmapi_v3_entrypoint.py \
            v5/source_scout_cmapi_v4_entrypoint.py \
            tests_v5/test_source_scout_benchmark.py \
            tests_v5/test_source_scout_cmapi_v3.py

      - name: Run Source Scout and CMAPI focused safety tests
        run: |
          python -m unittest \
            tests_v5.test_source_scout_benchmark \
            tests_v5.test_source_scout_cmapi_v3 -v

      - name: Run bounded CMAPI EN FR JP history and sold benchmark
        run: python -m v5.source_scout_cmapi_v4_entrypoint

      - name: Publish CMAPI benchmark summary
        if: always() && hashFiles('cmapi_benchmark.md') != ''
        shell: bash
        run: cat cmapi_benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CMAPI benchmark evidence
        if: always() && hashFiles('cmapi_benchmark.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cmapi-benchmark-${{ github.run_id }}
          path: |
            cmapi_benchmark.json
            cmapi_benchmark.md
          if-no-files-found: error
          retention-days: 14
