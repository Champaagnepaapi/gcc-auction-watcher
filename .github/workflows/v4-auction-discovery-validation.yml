name: V4 Auction Discovery Validation

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "v4_auction_item_discovery.py"
      - "v4_auction_pagination_stability.py"
      - "v4_private_auction_coverage.py"
      - "v4_kb_shadow_bridge.py"
      - "v4_canonical_multimarket.py"
      - "v4_edge_hunter_safety.py"
      - "v4_multimarket_safety.py"
      - "v4_structural_edge_hunter.py"
      - "v4_ppt_shadow_model.py"
      - "v4_ppt_shadow_provider.py"
      - "v4_ppt_shadow_language_bridge.py"
      - "v4_ppt_shadow_grader_guard.py"
      - "compare_auction_discovery.py"
      - "run_watcher_safe.py"
      - "run_watcher_multimarket.py"
      - "watcher.py"
      - "tests/**"
      - ".github/workflows/watcher.yml"
      - ".github/workflows/v4-kb-shadow-ingest.yml"
      - ".github/workflows/v4-auction-discovery-validation.yml"
      - ".github/workflows/v4-ppt-shadow-offline-validation.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref_name != 'agent/v4-ppt-clean-20260816'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run complete V4 tests
        run: python -m unittest discover -s tests -p "test*.py" -v

      - name: Compile changed V4 Python files
        run: |
          python -m py_compile v4_auction_item_discovery.py
          python -m py_compile v4_auction_pagination_stability.py
          python -m py_compile v4_private_auction_coverage.py
          python -m py_compile v4_kb_shadow_bridge.py
          python -m py_compile compare_auction_discovery.py
          python -m py_compile run_watcher_safe.py
          python -m py_compile v4_canonical_multimarket.py
          python -m py_compile v4_edge_hunter_safety.py
          python -m py_compile v4_multimarket_safety.py
          python -m py_compile v4_structural_edge_hunter.py
          python -m py_compile v4_ppt_shadow_model.py
          python -m py_compile v4_ppt_shadow_provider.py
          python -m py_compile v4_ppt_shadow_language_bridge.py
          python -m py_compile v4_ppt_shadow_grader_guard.py
          python -m py_compile run_watcher_multimarket.py

      - name: Compare effective and legacy discovery live
        if: github.event_name != 'pull_request' || github.head_ref != 'agent/v4-ppt-clean-20260816'
        id: compare
        env:
          V4_AUCTION_COMPARE_MINUTES: "720"
        run: python compare_auction_discovery.py

      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Post comparison summary on PR
        if: always() && github.event_name == 'pull_request' && github.head_ref != 'agent/v4-ppt-clean-20260816'
        uses: actions/github-script@v7
        env:
          PRIMARY_COMPLETE: ${{ steps.compare.outputs.primary_complete }}
          PRIMARY_SCOPE: ${{ steps.compare.outputs.primary_scope }}
          PRIMARY_ROWS: ${{ steps.compare.outputs.primary_rows_seen }}
          EFFECTIVE_MODE: ${{ steps.compare.outputs.effective_mode }}
          PRIMARY_CANDIDATES: ${{ steps.compare.outputs.primary_candidates }}
          LEGACY_CANDIDATES: ${{ steps.compare.outputs.legacy_candidates }}
          PRIMARY_ONLY: ${{ steps.compare.outputs.primary_only }}
          LEGACY_ONLY: ${{ steps.compare.outputs.legacy_only }}
          PRIMARY_UNRESOLVED: ${{ steps.compare.outputs.primary_unresolved }}
          LEGACY_UNRESOLVED: ${{ steps.compare.outputs.legacy_unresolved }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              "### V4 auction discovery live comparison",
              `run_id=${context.runId}`,
              "diagnostic_horizon_minutes=720",
              `api_primary_complete=${process.env.PRIMARY_COMPLETE || "unavailable"}`,
              `api_primary_scope=${process.env.PRIMARY_SCOPE || "unavailable"}`,
              `api_rows_seen=${process.env.PRIMARY_ROWS || "unavailable"}`,
              `effective_production_mode=${process.env.EFFECTIVE_MODE || "unavailable"}`,
              `effective_candidates=${process.env.PRIMARY_CANDIDATES || "unavailable"}`,
              `legacy_candidates=${process.env.LEGACY_CANDIDATES || "unavailable"}`,
              `effective_only=${process.env.PRIMARY_ONLY || "unavailable"}`,
              `legacy_only=${process.env.LEGACY_ONLY || "unavailable"}`,
              `effective_unresolved=${process.env.PRIMARY_UNRESOLVED || "unavailable"}`,
              `legacy_unresolved=${process.env.LEGACY_UNRESOLVED || "unavailable"}`,
              "An invalid/incomplete public API is not trusted: V4 must prove coverage through the full legacy fallback plus the stable weekly safety net.",
              "No bids, purchases, checkout, ntfy notification, or state mutation are performed by this comparison.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  ppt-live-shadow:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'agent/v4-ppt-clean-20260816'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      V4_PPT_SHADOW_ENABLED: "true"
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      V4_POKETRACE_MAX_REQUESTS_PER_RUN: "12"
      V4_PPT_SHADOW_MAX_HTTP_CALLS_PER_RUN: "12"
      V4_PPT_SHADOW_CREDIT_CAP_PER_RUN: "60"
      V4_PPT_SHADOW_DAILY_REMAINING_FLOOR: "15000"
      V4_PPT_SHADOW_REQUEST_INTERVAL_SECONDS: "1.10"
      V4_PPT_SHADOW_CACHE_TTL_HOURS: "1"
      STATE_FILE: ".v4-ppt-live/state.json"
      NTFY_TOPIC: ""
      V4_KB_SHADOW_SPOOL_PATH: ""
      EBAY_ENABLED: "false"
      PSA_APR_ENABLED: "false"
      V4_EXACT_ACTIVE_ASK_ENABLED: "false"
      V4_MISLISTED_SLAB_HUNTER_ENABLED: "false"
      V4_CERT_PROBLEM_NOTIFICATIONS_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout selected clean shadow branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert live-shadow safety contract
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "agent/v4-ppt-clean-20260816"
          test "${V4_PPT_SHADOW_ENABLED}" = "true"
          test -n "${POKEMONPRICETRACKER_API_KEY:-}"
          test -z "${NTFY_TOPIC:-}"
          test -z "${V4_KB_SHADOW_SPOOL_PATH:-}"
          test "${STATE_FILE}" != "state.json"
          echo "V4 PPT clean live shadow: bounded GET-only provider use, ephemeral state, no ntfy/Neon"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          playwright install --with-deps chromium

      - name: Run bounded V4 PPT live shadow
        shell: bash
        run: |
          mkdir -p .v4-ppt-live
          set +e
          python run_watcher_multimarket.py 2>&1 | tee v4_ppt_live_shadow.log
          status=${PIPESTATUS[0]}
          echo "${status}" > .v4-ppt-live/watcher_exit_code.txt
          exit 0

      - name: Build normalized shadow report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('.v4-ppt-live/state.json')
          exit_path = Path('.v4-ppt-live/watcher_exit_code.txt')
          state = json.loads(state_path.read_text(encoding='utf-8')) if state_path.exists() else {}
          root = state.get('v4_ppt_shadow') if isinstance(state.get('v4_ppt_shadow'), dict) else {}
          exit_code = int(exit_path.read_text().strip()) if exit_path.exists() else None
          report = {
              'kind': 'V4_PPT_CLEAN_LIVE_SHADOW',
              'run_head_sha': '${{ github.sha }}',
              'watcher_exit_code': exit_code,
              'production_economic_use': False,
              'notification_use': False,
              'last_error': root.get('last_error'),
              'last_run': root.get('last_run'),
              'records': root.get('records', {}),
          }
          Path('v4_ppt_live_shadow_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps({
              'run_head_sha': report['run_head_sha'],
              'watcher_exit_code': exit_code,
              'last_run': root.get('last_run'),
              'record_count': len(root.get('records', {})) if isinstance(root.get('records'), dict) else 0,
          }, ensure_ascii=False))
          PY

      - name: Assert shadow remained non-economic
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('v4_ppt_live_shadow_report.json').read_text(encoding='utf-8'))
          assert report['production_economic_use'] is False
          assert report['notification_use'] is False
          last_run = report.get('last_run')
          assert isinstance(last_run, dict), 'PPT shadow did not produce last_run telemetry'
          assert last_run.get('production_economic_use') is False
          assert last_run.get('notification_use') is False
          records = report.get('records') or {}
          for record in records.values():
              if isinstance(record, dict):
                  assert record.get('production_economic_use', False) is False
                  assert record.get('notification_use', False) is False
          log = Path('v4_ppt_live_shadow.log').read_text(encoding='utf-8', errors='replace')
          assert 'Notification ntfy envoyée' not in log
          print('V4 PPT clean live shadow safety assertions: PASS')
          PY

      - name: Upload live-shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-ppt-clean-live-shadow-${{ github.run_id }}
          path: |
            v4_ppt_live_shadow_report.json
            v4_ppt_live_shadow.log
          if-no-files-found: error
          retention-days: 14
