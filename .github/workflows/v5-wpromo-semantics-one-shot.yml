name: V5 wPromo Semantics One-shot

on:
  push:
    branches:
      - agent/v5-post-macro-applicability-retry
    paths:
      - 'scripts/patch_v5_wpromo_semantics.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v5-post-macro-applicability-retry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact bounded semantic fix
        run: python scripts/patch_v5_wpromo_semantics.py
      - name: Commit target code/tests and remove one-shot tooling
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected=$'tests_v5/test_identity_coverage_expansion.py\nv5/microvariants.py\nv5/variant_semantics.py'
          test "$changed" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_v5_wpromo_semantics.py
          git rm .github/workflows/v5-wpromo-semantics-one-shot.yml
          git add v5/variant_semantics.py v5/microvariants.py tests_v5/test_identity_coverage_expansion.py
          git diff --cached --check
          git commit -m "fix(v5): separate TCGdex W-stamp from promo semantics"
          git push origin HEAD:agent/v5-post-macro-applicability-retry
