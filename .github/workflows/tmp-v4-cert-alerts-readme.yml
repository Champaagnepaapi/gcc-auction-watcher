name: Temporary PR67 README handoff

on:
  push:
    branches:
      - agent/v4-all-cert-problem-alerts
    paths:
      - .github/workflows/tmp-v4-cert-alerts-readme.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-all-cert-problem-alerts
      - name: Append canonical handoff
        shell: bash
        run: |
          if grep -q '^# PR #67 — alertes immédiates sur tout problème de certificat PSA/PCA/CCC$' README.md; then
            echo 'PR67 handoff already present'
            exit 0
          fi
          printf '%s' '' | base64 --decode >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: record PR67 immediate cert problem alerts'
          git push origin HEAD:agent/v4-all-cert-problem-alerts
