name: V5 JustTCG Fix Validation Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data
    paths:
      - .github/workflows/v5-justtcg-fix-validation-temp.yml

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run V5 tests and compile
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt Pillow==12.3.0
          python -m unittest discover -s tests_v5 -p 'test*.py' -v
          python -m compileall -q v5
          git diff --check HEAD~1..HEAD
      - name: Safety assertion
        run: |
          echo 'PokeTrace live calls: 0'
          echo 'JustTCG live calls: 0'
          echo 'eBay live calls: 0'
          echo 'Secrets injected: 0'
      - name: Publish validation status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'v5-justtcg-fix-offline',
              description: `JustTCG fix offline validation: ${state}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
