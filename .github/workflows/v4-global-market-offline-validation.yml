name: V4 Global Market Offline Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "v4_global_market_core.py"
      - "v4_global_live_shadow.py"
      - "v4_global_live_shadow_hardened.py"
      - "v4_global_live_confirmed.py"
      - "v4_global_economic_confirmation.py"
      - "v4_global_ppt_confirmation.py"
      - "v4_global_comc_hardening.py"
      - "v4_global_comc_hardening_v2.py"
      - "v4_global_magi_registry_hardening.py"
      - "v4_global_magi_target_hardening.py"
      - "v4_global_magi_target_hardening_v2.py"
      - "v4_tcgdex_japanese_set_registry.py"
      - "v4_global_rejection_diagnostics.py"
      - "v4_global_retrieval_hardening.py"
      - "v4_global_retrieval_hardening_v2.py"
      - "v4_global_retrieval_hardening_v3.py"
      - "v4_global_ppt_bridge.py"
      - "v4_global_poketrace_bridge.py"
      - "v4_market_cardova.py"
      - "v4_market_gcc_bridge.py"
      - "v4_market_magi_bridge.py"
      - "v4_market_fanatics_bridge.py"
      - "v4_market_comc_bridge.py"
      - "v4_market_verified_offer.py"
      - "tests_global/**"
      - ".github/workflows/v4-global-market-offline-validation.yml"
      - ".github/workflows/v4-global-live-shadow.yml"
      - ".github/global-economic-live-once"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install PyYAML

      - name: Run focused global-market tests
        run: python -m unittest discover -s tests_global -p "test*.py" -v

      - name: Run existing V4 multimarket regression tests
        run: python -m unittest discover -s tests -p "test_v4_*multimarket*.py" -v

      - name: Compile changed Python files
        run: |
          python -m py_compile v4_global_market_core.py
          python -m py_compile v4_global_live_shadow.py
          python -m py_compile v4_global_live_shadow_hardened.py
          python -m py_compile v4_global_live_confirmed.py
          python -m py_compile v4_global_economic_confirmation.py
          python -m py_compile v4_global_ppt_confirmation.py
          python -m py_compile v4_global_comc_hardening.py
          python -m py_compile v4_global_comc_hardening_v2.py
          python -m py_compile v4_global_magi_registry_hardening.py
          python -m py_compile v4_global_magi_target_hardening.py
          python -m py_compile v4_global_magi_target_hardening_v2.py
          python -m py_compile v4_tcgdex_japanese_set_registry.py
          python -m py_compile v4_global_rejection_diagnostics.py
          python -m py_compile v4_global_retrieval_hardening.py
          python -m py_compile v4_global_retrieval_hardening_v2.py
          python -m py_compile v4_global_retrieval_hardening_v3.py
          python -m py_compile v4_global_ppt_bridge.py
          python -m py_compile v4_global_poketrace_bridge.py
          python -m py_compile v4_market_cardova.py
          python -m py_compile v4_market_gcc_bridge.py
          python -m py_compile v4_market_magi_bridge.py
          python -m py_compile v4_market_fanatics_bridge.py
          python -m py_compile v4_market_comc_bridge.py
          python -m py_compile v4_market_verified_offer.py
          python -m py_compile tests_global/test_v4_global_market_core.py
          python -m py_compile tests_global/test_v4_global_live_shadow.py
          python -m py_compile tests_global/test_v4_global_comc_hardening.py
          python -m py_compile tests_global/test_v4_global_comc_hardening_v2.py
          python -m py_compile tests_global/test_v4_global_magi_registry_hardening.py
          python -m py_compile tests_global/test_v4_global_magi_target_hardening.py
          python -m py_compile tests_global/test_v4_global_magi_target_hardening_v2.py
          python -m py_compile tests_global/test_v4_global_rejection_diagnostics.py
          python -m py_compile tests_global/test_v4_global_retrieval_hardening.py
          python -m py_compile tests_global/test_v4_global_retrieval_hardening_v2.py
          python -m py_compile tests_global/test_v4_global_retrieval_hardening_v3.py
          python -m py_compile tests_global/test_v4_global_evidence_bridges.py
          python -m py_compile tests_global/test_v4_global_economic_confirmation.py
          python -m py_compile tests_global/test_v4_market_cardova.py
          python -m py_compile tests_global/test_v4_market_verified_offer.py

      - name: Parse workflows YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in (
              pathlib.Path('.github/workflows/v4-global-market-offline-validation.yml'),
              pathlib.Path('.github/workflows/v4-global-live-shadow.yml'),
          ):
              yaml.safe_load(path.read_text())
              print(f"YAML PASS: {path}")
          PY

      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD

  # Temporary, branch-local, user-authorized one-shot live. It is inert unless
  # the marker file exists in the checked-out PR head and is removed after use.
  economic-confirmation-once:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/v4-global-economic-confirmation-20260819' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NTFY_TOPIC: ""
      JAPAN_EDGE_NOTIFY_ENABLED: "false"
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check one-shot marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/global-economic-live-once ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.marker.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore Playwright browser cache
        if: ${{ steps.marker.outputs.enabled == 'true' }}
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-python312-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: ${{ steps.marker.outputs.enabled == 'true' }}
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Ensure Chromium runtime is usable
        if: ${{ steps.marker.outputs.enabled == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          set +e
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
          launch_status=$?
          set -e
          if [ "$launch_status" -ne 0 ]; then
            timeout 180s playwright install --with-deps chromium
          fi

      - name: Run read-only economic confirmation diagnostic
        if: ${{ steps.marker.outputs.enabled == 'true' }}
        run: |
          python v4_global_live_confirmed.py \
            --output-dir global_shadow_out \
            --max-identities "5" \
            --market-candidates "8"

      - name: Assert no tracked runtime mutation
        if: ${{ steps.marker.outputs.enabled == 'true' }}
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload shadow artifact
        if: ${{ steps.marker.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: v4-global-market-live-shadow-${{ github.run_id }}
          path: global_shadow_out/
          if-no-files-found: error
          retention-days: 7
