name: PR63 README EOF fix

on:
  push:
    branches:
      - agent/v4-image-grade-mismatch-fallback
    paths:
      - .github/workflows/pr63-readme-eof-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-image-grade-mismatch-fallback
      - name: Normalize README EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: normalize README EOF"
          git push origin HEAD:agent/v4-image-grade-mismatch-fallback
