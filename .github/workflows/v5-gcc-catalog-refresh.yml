name: V5 GCC Catalog Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  refresh-gcc-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCC_CATALOG_INDEX_FILE: gcc_catalog_index.json
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore cumulative GCC catalogue
        uses: actions/cache@v4
        with:
          path: gcc_catalog_index.json
          key: v5-gcc-catalog-${{ github.run_id }}
          restore-keys: |
            v5-gcc-catalog-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public-catalogue dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh GCC-only cumulative catalogue
        run: python -m v5.gcc_catalog_cache
