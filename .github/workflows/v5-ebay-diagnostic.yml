name: V5 eBay Enrichment Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-ebay-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      RAW_MAX_PAID_GRADINGS_PER_RUN: "0"
      CARDGRADER_V5_ALLOW_PAID_CALLS: "false"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only HTTP dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.4

      - name: Run aggregate-only V5 eBay enrichment diagnostic
        run: python -m v5.ebay_live_diagnostic
