name: V4 Global Notify Inspectable Dry Run

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/v4-global-notify-once-pr.yml"

permissions:
  contents: read

concurrency:
  group: v4-global-notify-inspectable-dry-run
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GLOBAL_NOTIFY_ENABLED: "false"
      GLOBAL_NOTIFY_DEDUPE_TTL_DAYS: "14"
      GLOBAL_NOTIFY_REPRICE_DROP_PCT: "5"
      GLOBAL_PPT_MAX_HTTP_CALLS: "12"
      GLOBAL_PPT_MAX_CREDITS: "60"
      GLOBAL_PPT_DAILY_REMAINING_FLOOR: "15000"
      POKEMONPRICETRACKER_API_KEY: ${{ secrets.POKEMONPRICETRACKER_API_KEY }}
      POKETRACE_API_KEY: ${{ secrets.POKETRACE_API_KEY }}
      NTFY_SERVER: "https://ntfy.sh"
      NTFY_TOPIC: ""
      JAPAN_EDGE_NOTIFY_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-python312-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        timeout-minutes: 3
        run: pip install -r requirements.txt

      - name: Ensure Chromium runtime is usable
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          set +e
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              browser.close()
          PY
          launch_status=$?
          set -e
          if [ "$launch_status" -ne 0 ]; then
            timeout 180s playwright install --with-deps chromium
          fi

      - name: Run confirmed Global notification lane dry-run
        run: |
          python v4_global_notify.py \
            --state .global-notify-state/state.json \
            --output-dir global_notify_out \
            --max-identities 5 \
            --market-candidates 8

      - name: Assert dry-run safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('global_notify_out/global_notify_report.json').read_text())
          assert report['notifications'] is False
          assert report['transactions'] is False
          delivery = report['notification_delivery']
          assert delivery['enabled'] is False
          assert delivery['sent'] == 0
          assert delivery['automatic_purchase'] is False
          assert delivery['automatic_bid'] is False
          assert delivery['automatic_checkout'] is False
          print('DRY-RUN SAFETY PASS')
          PY

      - name: Assert no tracked runtime mutation
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload Global notification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-global-notify-inspectable-${{ github.run_id }}
          path: global_notify_out/
          if-no-files-found: ignore
          retention-days: 14
