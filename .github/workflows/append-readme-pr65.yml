name: Append PR65 README handoff

on:
  push:
    branches:
      - agent/v4-psa-pca-ccc-ocr-hardening
    paths:
      - ".github/workflows/append-readme-pr65.yml"

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-psa-pca-ccc-ocr-hardening
      - name: Append canonical PR65 handoff once
        run: |
          if grep -q '^# PR #65 — PSA/PCA/CCC cert-first + OCR ciblé conservateur$' README.md; then
            echo "README already updated"
            exit 0
          fi
          cat PR65_README_APPEND.md >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record PR65 focused slab hardening"
          git push origin HEAD:agent/v4-psa-pca-ccc-ocr-hardening
