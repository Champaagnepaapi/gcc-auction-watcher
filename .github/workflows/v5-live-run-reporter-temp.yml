name: V5 Live Run Reporter Temp

on:
  push:
    branches:
      - agent/v5-poketrace-cardmarket-market-data
    paths:
      - .github/workflows/v5-live-run-reporter-temp.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report-live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Find controlled PokeTrace Free run and report it
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const targetSha = 'df758ade5e909d2a0ecd1241834b045b291f155d';
            let match = null;
            for (let attempt = 0; attempt < 40; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'v5-live-raw-pipeline-diagnostic.yml',
                branch: 'agent/v5-poketrace-cardmarket-market-data',
                event: 'push',
                per_page: 20,
              });
              match = data.workflow_runs.find(run => run.head_sha === targetSha) || null;
              if (match && match.status === 'completed') break;
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            if (!match) core.setFailed(`No V5 live run found for ${targetSha}`);
            const body = [
              '### Controlled PokeTrace Free live run',
              `trigger_commit=${targetSha}`,
              `run_id=${match.id}`,
              `event=${match.event}`,
              `status=${match.status}`,
              `conclusion=${match.conclusion || 'pending'}`,
              `head_sha=${match.head_sha}`,
              `html_url=${match.html_url}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
              body,
            });
