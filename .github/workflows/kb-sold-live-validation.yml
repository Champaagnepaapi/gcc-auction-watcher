name: Robot KB SOLD live validation

on:
  push:
    branches:
      - agent/kb-gcc-sold-collector

permissions:
  contents: read

jobs:
  validate-sold-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch explicit GCC SOLD rows into in-memory KB only
        run: |
          python -m robot_kb.sidecar \
            --database :memory: \
            --live-gcc sold \
            --allow-live-read-only \
            --page-size 5 \
            --max-pages 1 \
            --max-records 5
