name: PR63 README handoff

on:
  push:
    branches:
      - agent/v4-image-grade-mismatch-fallback
    paths:
      - .github/workflows/pr63-readme-handoff.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v4-image-grade-mismatch-fallback
      - name: Append canonical PR63 handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '# PR #63 — Mislisted Slab Hunter cert-first + OCR fallback'
          if marker not in text:
              text = text.rstrip() + '''\n\n---\n\n# PR #63 — Mislisted Slab Hunter cert-first + OCR fallback\n\nÉtat candidat V4 validé au SHA **`c59ddc09bc4913c045b2112bd74931478a88fa89`**.\n\nOrdre de preuve :\n\n1. lire grader + numéro de certificat GCC ;\n2. interroger le vérificateur officiel du grader lorsqu’un adaptateur robuste existe (**PSA + CCC** dans ce batch) ;\n3. comparer grade officiel ↔ grade metadata GCC ;\n4. seulement si le certificat est indisponible/non lisible, tenter l’OCR de l’étiquette du slab ;\n5. une preuve OCR seule reste `IMAGE_ONLY`, non confirmée et **MANUAL REVIEW**.\n\nRègles :\n\n- certificat officiel > OCR image ;\n- `POSITIVE_GRADE_MISMATCH` : alerte manuelle, mais la valorisation V4 normale reste basée sur la metadata tant qu’un humain n’a pas confirmé ;\n- `NEGATIVE_GRADE_MISMATCH` : alerte manuelle + blocage de l’opportunité économique normale afin de ne jamais valoriser au grade GCC surestimé ;\n- OCR ambigu (ex. note globale + subgrades différents) → aucune conclusion automatique ;\n- grader sans vérificateur officiel supporté → fallback OCR uniquement ;\n- aucun achat, bid, checkout, paiement ou grading automatique.\n\nRuntime production proposé : `V4_MISLISTED_SLAB_HUNTER_ENABLED=true`, `V4_MISLISTED_IMAGE_OCR_ENABLED=true`, Tesseract installé par le workflow si absent.\n\nValidation PR #63 : run **`31836557339`**, job **`94884024784`** — **466/466 tests V4 PASS**, compilation PASS, `git diff --check` PASS, comparaison discovery live PASS (`legacy_only=0`, `private safety-net failures=0`).\n''' + '\n'
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit README only
        run: |
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: record PR63 cert-first mislisted slab handoff"
          git push origin HEAD:agent/v4-image-grade-mismatch-fallback
